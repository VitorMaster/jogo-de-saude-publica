<style>
:root {
  --bg: #f2f6f5; --card: #ffffff; --ink: #14201e; --muted: #5b6b68; --line: #dbe5e2;
  --brand: #0f766e; --brand-ink: #ffffff; --brand-soft: #d9f0ec;
  --ok: #15803d; --ok-soft: #dcfce7; --warn: #b45309; --warn-soft: #fef3c7;
  --bad: #b91c1c; --bad-soft: #fee2e2; --info-soft: #e0f2fe; --info: #0369a1;

}
@media (prefers-color-scheme: dark) {

    --bg: #0e1615; --card: #16211f; --ink: #e6f0ee; --muted: #93a8a4;
    --line: #27383a; --brand: #2dd4bf; --brand-ink: #062b27; --brand-soft: #123c38;
    --ok: #4ade80; --ok-soft: #12351f; --warn: #fbbf24; --warn-soft: #3a2f0f;
    --bad: #f87171; --bad-soft: #3d1717; --info-soft: #11303f; --info: #7dd3fc;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0e1615; --card: #16211f; --ink: #e6f0ee; --muted: #93a8a4;
    --line: #27383a; --brand: #2dd4bf; --brand-ink: #062b27; --brand-soft: #123c38;
    --ok: #4ade80; --ok-soft: #12351f; --warn: #fbbf24; --warn-soft: #3a2f0f;
    --bad: #f87171; --bad-soft: #3d1717; --info-soft: #11303f; --info: #7dd3fc;
    --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overscroll-behavior: none;
}
#app { max-width: 720px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }

/* Cabeçalho */
.topo { flex: none; z-index: 5; background: var(--brand); color: var(--brand-ink); padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; }
.topo .linha { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.topo h1 { font-size: 17px; font-weight: 700; }
.topo .data { font-size: 14px; opacity: .9; }
.chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.chip { background: rgba(255,255,255,.18); border-radius: 999px; padding: 3px 10px; font-size: 13px; white-space: nowrap; }
@media (prefers-color-scheme: dark) { .chip { background: rgba(0,0,0,.18); } }

/* Conteúdo */
main { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 24px; }
.secao { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; font-weight: 700; }
.secao:first-child { margin-top: 4px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); }
.card + .card { margin-top: 10px; }
.grade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.casa { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); min-height: 112px; display: flex; flex-direction: column; gap: 6px; }
.casa:active { transform: scale(.98); }
.casa .nome { font-weight: 700; font-size: 15px; }
.casa .moradores { font-size: 20px; letter-spacing: 1px; }
.casa .selos { display: flex; gap: 4px; flex-wrap: wrap; min-height: 22px; }
.selo { font-size: 12px; padding: 2px 7px; border-radius: 999px; background: var(--info-soft); color: var(--info); font-weight: 600; }
.selo.bad { background: var(--bad-soft); color: var(--bad); }
.selo.warn { background: var(--warn-soft); color: var(--warn); }
.selo.ok { background: var(--ok-soft); color: var(--ok); }
.casa > span { display: block; }
.casa > .selos { display: flex; }
.barra { display: block; height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--brand); border-radius: 999px; }
.barra.perigo > i { background: var(--bad); }
.barra.alerta > i { background: var(--warn); }
.rotulo { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 3px; }

/* Botões */
.btn { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 600; text-align: left; cursor: pointer; }
.btn:active { transform: scale(.99); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.primario { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
.btn.perigo { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.btn small { font-weight: 500; opacity: .8; white-space: nowrap; }
.btn + .btn { margin-top: 8px; }
.linha-btn { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.linha-btn .btn + .btn { margin-top: 0; }
.dica { font-size: 13px; color: var(--muted); margin-top: 4px; }

/* Barra inferior */
.rodape { flex: none; z-index: 6; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }

.avancar { padding: 8px 12px 0; }
.abas { display: grid; grid-template-columns: repeat(4, 1fr); }
.aba { background: none; border: 0; padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11.5px; color: var(--muted); min-height: 52px; }
.aba .ic { font-size: 20px; }
.aba[aria-current="page"] { color: var(--brand); font-weight: 700; }

/* Folha (modal) */
.fundo { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
.folha { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding: 14px 16px calc(20px + env(safe-area-inset-bottom)); }
.folha-topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.folha h2 { font-size: 18px; }
.fechar { background: var(--card); border: 1px solid var(--line); border-radius: 999px; width: 38px; height: 38px; font-size: 18px; cursor: pointer; }
.voltar { background: none; border: 0; color: var(--brand); font-weight: 700; padding: 6px 0; margin-bottom: 4px; cursor: pointer; }

/* Pessoas */
.pessoa { width: 100%; display: flex; gap: 10px; align-items: center; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 58px; cursor: pointer; }
.pessoa + .pessoa { margin-top: 8px; }
.pessoa .emoji { font-size: 28px; }
.pessoa .info { flex: 1; min-width: 0; }
.pessoa .nome { font-weight: 700; }
.pessoa .sub { font-size: 13px; color: var(--muted); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
.kv span:nth-child(odd) { color: var(--muted); }
.kv span:nth-child(even) { font-weight: 600; text-align: right; }
.hab { margin-top: 8px; }

/* Diário */
.entrada { border-left: 4px solid var(--line); padding: 8px 10px; background: var(--card); border-radius: 0 10px 10px 0; font-size: 14.5px; }
.entrada + .entrada { margin-top: 8px; }
.entrada .quando { font-size: 12px; color: var(--muted); }
.entrada.alerta { border-color: var(--bad); }
.entrada.bom { border-color: var(--ok); }
.entrada.aprendizado { border-color: var(--info); background: var(--info-soft); }
.entrada.info { border-color: var(--brand); }

/* Toast */
#toast { position: fixed; left: 50%; transform: translate(-50%, 20px); bottom: calc(86px + env(safe-area-inset-bottom)); max-width: min(92vw, 520px); z-index: 40; background: #14201e; color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 14.5px; opacity: 0; pointer-events: none; transition: .2s; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#toast.erro { background: #991b1b; }

.vazio { text-align: center; color: var(--muted); padding: 24px 8px; }
.aviso { font-size: 12.5px; color: var(--muted); margin-top: 14px; }
.liga { font-size: 22px; font-weight: 800; }
.grande { font-size: 28px; font-weight: 800; }

/* Guia e ajuda */
.guia { display: flex; gap: 12px; align-items: center; background: var(--info-soft); border-color: var(--info); margin-bottom: 4px; font-size: 15px; }
.passo { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; }
.passos .p { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; }
.passos .p + .p { margin-top: 12px; }
.ajuda { margin-left: 6px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(255,255,255,.25); color: inherit; font-weight: 800; cursor: pointer; }

/* Mundo (canvas) */
.mundo { position: relative; flex: 1; min-height: 0; background: #6fae60; }
.mundo[hidden], .vista[hidden] { display: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.dica-mundo { position: absolute; left: 10px; right: 56px; top: 10px; background: var(--card); color: var(--ink); border: 1px solid var(--info); border-radius: 12px; padding: 8px 12px; font-size: 14px; box-shadow: var(--shadow); }
.ferr { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 8px; }
.ferr button { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 18px; cursor: pointer; box-shadow: var(--shadow); }
.cartao { position: absolute; left: 8px; right: 8px; bottom: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; box-shadow: 0 4px 18px rgba(0,0,0,.25); max-width: 560px; margin: 0 auto; }
.cartao[hidden] { display: none; }
.c-topo { display: flex; gap: 10px; align-items: center; }
.c-topo .emoji { font-size: 30px; }
.c-id { flex: 1; min-width: 0; }
.c-id small { color: var(--muted); font-weight: 500; }
.c-acao { font-size: 13px; color: var(--muted); min-height: 18px; }
.necs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 8px 0; }
.nec { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 16px; }
.barra.mini { width: 100%; height: 7px; }
.barra.mini i.ruim { background: var(--bad); }
.barra.mini i.medio { background: var(--warn); }
.c-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.btn.peq { min-height: 40px; padding: 6px 4px; font-size: 12.5px; justify-content: center; text-align: center; }
.c-btns .btn + .btn { margin-top: 0; }
.fechar.peq { width: 30px; height: 30px; font-size: 14px; }

/* Topo com velocidade */
.topo .linha { align-items: center; }
.topo .data { font-size: 13px; opacity: .95; margin-left: auto; }
.linha2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.vel { display: flex; gap: 4px; }

.topo .chips { margin-top: 0; }
.topo .ajuda { margin-left: 8px; }
.dica-t { font-size: 13px; color: var(--muted); margin-top: 4px; }
.lista { margin: 6px 0 0; padding-left: 20px; font-size: 14px; }

.topo h1 { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.topo .data { white-space: nowrap; }

.topo { padding-bottom: 8px; }
.topo .linha { gap: 8px; }
.topo .linha .chips { margin: 0 0 0 auto; flex: none; }
.topo .ajuda { margin-left: 0; flex: none; }
.linha2 { margin-top: 6px; flex-wrap: nowrap; justify-content: space-between; }
.topo .data { font-size: 12.5px; white-space: nowrap; margin: 0; opacity: .95; }
.vel button { min-width: 30px; height: 30px; padding: 0 6px; font-size: 12px; }

// Gerador pseudo-aleatório com estado serializável (mulberry32) — permite salvar/carregar e testar de forma determinística.
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const sig = (x) => 1 / (1 + Math.exp(-x));

function rnd(s) {
  s.rng = (s.rng + 0x6d2b79f5) >>> 0;
  let t = s.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rint = (s, a, b) => a + Math.floor(rnd(s) * (b - a + 1));
const rfloat = (s, a, b) => a + rnd(s) * (b - a);
const pick = (s, arr) => arr[Math.floor(rnd(s) * arr.length)];

// Motor de simulação — puro (sem DOM). Todas as regras numéricas vêm de data/*.json.
// O estado do jogo é um objeto simples (serializável em JSON).

const CONDS = ['has', 'dm', 'dep'];
const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const nomeMes = (m) => MESES[m];
const rotuloData = (s) => `${MESES[s.mes]} de ${s.ano}`;

/* ---------- Fatores de risco ---------- */

function xs(p) {
  return {
    idade: clamp((p.idade - 18) / 62, 0, 1),
    sedentarismo: 1 - p.habitos.atividade / 100,
    alimentacao: 1 - p.habitos.alimentacao / 100,
    sono: 1 - p.habitos.sono / 100,
    estresse: p.habitos.estresse / 100,
    tabagismo: p.tabagismo ? 1 : 0,
    imc: clamp((p.imc - 18) / 20, 0, 1),
  };
}

/** Escore de risco centrado em 0 (≈ 0 para a pessoa "média"). Positivo = mais risco. */
function riskZ(p, c, id) {
  const x = xs(p);
  let z = 0;
  for (const [k, w] of Object.entries(c.pesos)) z += w * ((k === 'genetica' ? p.genetica[id] : x[k]) - 0.5);
  return z;
}

/* ---------- Criação do jogo ---------- */

function novaPessoa(s, cfg, tpl, famId, idx) {
  const adulto = tpl.idade >= 18;
  const hb = cfg.game.habitosBase || {};
  const h = (k, lo = 20, hi = 90) => { const [a, b] = hb[k] || [lo, hi]; return Math.round(a + rnd(s) * (b - a)); };
  return {
    id: `${famId}-${idx}`, familiaId: famId, nome: tpl.nome, idade: tpl.idade, sexo: tpl.sexo,
    ocupacao: tpl.ocupacao || 'casa',
    habitos: { atividade: h('atividade'), alimentacao: h('alimentacao'), sono: h('sono'), estresse: h('estresse', 15, 85) },
    tabagismo: adulto && rnd(s) < (cfg.game.tabagismo ?? 0.16),
    imc: adulto ? Math.round((20 + rnd(s) * 14) * 10) / 10 : 17,
    genetica: { has: rnd(s), dm: rnd(s), dep: rnd(s) },
    cond: Object.fromEntries(CONDS.map((id) => [id, { estagio: 0, diag: false, trat: false, ctrl: false }])),
    dengue: { ativa: false, atendido: false },
    imune: 0,
    internado: false,
    conhecido: { habitos: null, visTurno: null, medidas: null, medidasTurno: null, suspeitas: [], risco: [] },
  };
}

function estagioInicial(s, cfg, p, id) {
  const c = cfg.cond[id];
  if (p.idade < c.idadeMin) return 0;
  const z = riskZ(p, c, id);
  const p1 = sig(c.init.a1 + c.init.b * z);
  const p2 = sig(c.init.a2 + c.init.b * z);
  const r = rnd(s);
  if (r < p2) return rnd(s) < c.init.pComplicadaInicial ? 3 : 2;
  if (r < p1) return 1;
  return 0;
}

function gerarTerritorio(s, cfg) {
  for (let tent = 0; tent < 40; tent++) {
    const familias = cfg.territorio.familias.map((ft) => {
      const f = {
        id: ft.id, nome: ft.nome,
        vinculo: rint(s, ft.vinculo[0], ft.vinculo[1]),
        visTurno: -99, pessoas: [],
      };
      ft.membros.forEach((m, i) => f.pessoas.push(novaPessoa(s, cfg, m, ft.id, i)));
      return f;
    });
    for (const f of familias) for (const p of f.pessoas) for (const id of CONDS) p.cond[id].estagio = estagioInicial(s, cfg, p, id);
    // Garante um começo com algo a descobrir: ≥3 doenças ocultas, incluindo hipertensão.
    const ocultas = familias.flatMap((f) => f.pessoas).flatMap((p) => CONDS.filter((id) => p.cond[id].estagio >= 2).map((id) => id));
    if (ocultas.length >= 3 && ocultas.includes('has')) return familias;
    if (tent === 39) return familias;
  }
}

function newGame(cfg, seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0) {
  const G = cfg.game;
  const s = {
    v: 2, seed, rng: seed >>> 0 || 1, tempoReal: false, cenario: cfg.cenario ? cfg.cenario.id : null,
    mes: G.inicio.mes, ano: G.inicio.ano, turno: 0,
    tempo: 0, tempoMax: 0, insumos: G.inicio.insumos, verba: G.inicio.verba,
    infestacao: G.inicio.infestacao, mutiraoTurno: -99,
    predios: Object.fromEntries(Object.keys(G.predios).map((k) => [k, 0])), obra: null,
    familias: [], diario: [], licoes: {}, internacoes: [], ultimoRelatorio: [],
  };
  s.familias = gerarTerritorio(s, cfg);
  s.tempoMax = tempoMaximo(s, cfg);
  s.tempo = s.tempoMax;
  s.diario.push({ mes: s.mes, ano: s.ano, tipo: 'info', texto: `Você assumiu a ${cfg.territorio.nomeUnidade}. Conheça as famílias do território, identifique riscos e acompanhe cada pessoa ao longo do tempo.` });
  return s;
}

/* ---------- Consultas ao estado ---------- */

const todasPessoas = (s) => s.familias.flatMap((f) => f.pessoas);
const achaPessoa = (s, id) => todasPessoas(s).find((p) => p.id === id);
const achaFamilia = (s, id) => s.familias.find((f) => f.id === id);
const familiaDe = (s, p) => achaFamilia(s, p.familiaId);

function tempoMaximo(s, cfg) {
  return cfg.game.inicio.tempoBase + cfg.game.tempoPorNivel * s.predios.consultorio;
}

function sintomasDengueVisiveis(s, p) {
  if (!p.dengue.ativa) return false;
  const f = familiaDe(s, p);
  return f.vinculo >= 50 || f.visTurno === s.turno;
}

function adesao(f) {
  return 0.35 + 0.6 * (f.vinculo / 100);
}

/* ---------- Ações do jogador ---------- */

const falha = (msg) => ({ ok: false, msg });
const sucesso = (msg, extra = {}) => ({ ok: true, msg, ...extra });

function gasta(s, custo) {
  if (s.tempoReal) return true; // no mundo em tempo real o custo é o tempo (deslocamento, fila) de quem executa
  if (s.tempo < custo) return false;
  s.tempo -= custo;
  return true;
}

function lembraHabitos(p) {
  p.conhecido.habitos = { ...p.habitos, tabagismo: p.tabagismo, imc: p.imc };
}

function acaoVisita(s, cfg, famId) {
  const f = achaFamilia(s, famId);
  if (f.visTurno === s.turno) return falha('Esta família já foi visitada neste mês.');
  if (!gasta(s, cfg.game.custos.visita)) return falha('Sem horas de equipe suficientes neste mês.');
  f.visTurno = s.turno;
  f.vinculo = clamp(f.vinculo + 8, 0, 100);
  const achados = [];
  for (const p of f.pessoas) {
    if (p.internado) continue;
    lembraHabitos(p);
    p.conhecido.visTurno = s.turno;
    if (p.dengue.ativa) achados.push(`${p.nome} está com sintomas de dengue`);
    for (const id of ['dm', 'dep']) {
      if (p.cond[id].estagio >= 2 && !p.cond[id].diag && rnd(s) < 0.5) {
        achados.push(`${p.nome} relata ${cfg.cond[id].queixas[rint(s, 0, cfg.cond[id].queixas.length - 1)]}`);
      }
    }
  }
  return sucesso(
    achados.length ? `Visita feita (vínculo +8). Você notou: ${achados.join('; ')}.` : 'Visita feita (vínculo +8). Você conheceu melhor os hábitos da família.',
  );
}

function valoresMedidos(s, p) {
  const h = p.cond.has, d = p.cond.dm;
  const faixa = (est, ctrl, tab, tabCtrl) => (ctrl && est >= 2 ? tabCtrl : tab[est]);
  const pasR = faixa(h.estagio, h.ctrl, [[105, 125], [126, 139], [142, 172], [150, 188]], [118, 136]);
  const glicR = faixa(d.estagio, d.ctrl, [[78, 97], [100, 125], [130, 250], [180, 300]], [95, 124]);
  const pas = rint(s, pasR[0], pasR[1]);
  const pad = Math.round(pas * 0.62 + rfloat(s, -4, 4));
  const glic = rint(s, glicR[0], glicR[1]);
  return { pas, pad, glic };
}

function registraMedidas(s, p) {
  const m = valoresMedidos(s, p);
  p.conhecido.medidas = m;
  p.conhecido.medidasTurno = s.turno;
  const susp = [];
  if (m.pas >= 140 || m.pad >= 90) susp.push('has');
  if (m.glic >= 126) susp.push('dm');
  p.conhecido.suspeitas = susp;
  return m;
}

function acaoMedir(s, cfg, pid) {
  const p = achaPessoa(s, pid);
  if (p.internado) return falha(`${p.nome} está internado(a).`);
  if (p.idade < 18) return falha('A aferição de rotina de PA e glicemia é indicada para adultos.');
  if (!gasta(s, cfg.game.custos.medir)) return falha('Sem horas de equipe suficientes neste mês.');
  const m = registraMedidas(s, p);
  const susp = p.conhecido.suspeitas;
  let msg = `PA ${m.pas}/${m.pad} mmHg · glicemia ${m.glic} mg/dL.`;
  if (susp.length) msg += ` Valores alterados — agende consulta para confirmar.`;
  else msg += ' Sem alterações importantes.';
  return sucesso(msg);
}

function acaoConsulta(s, cfg, pid) {
  const p = achaPessoa(s, pid);
  const f = familiaDe(s, p);
  if (p.internado) return falha(`${p.nome} está internado(a).`);
  if (!gasta(s, cfg.game.custos.consulta)) return falha('Sem horas de equipe suficientes neste mês.');
  lembraHabitos(p);
  p.conhecido.visTurno = s.turno;
  const achados = [];
  if (p.idade >= 18) registraMedidas(s, p);

  if (p.dengue.ativa) {
    p.dengue.atendido = true;
    achados.push('Quadro compatível com dengue: hidratação, repouso e sinais de alarme orientados');
  }
  for (const id of CONDS) {
    const c = cfg.cond[id], st = p.cond[id];
    if (p.idade < c.idadeMin || st.diag) continue;
    if (st.estagio >= 2) {
      const chance = id === 'dep' ? 0.35 + 0.5 * (f.vinculo / 100) : 0.9;
      if (rnd(s) < chance) {
        st.diag = true;
        achados.push(`Diagnóstico: ${c.nome.toLowerCase()}`);
      } else if (id === 'dep') {
        achados.push('Está reservado(a); a conversa ainda não revelou o que sente (mais vínculo ajuda)');
      }
    } else if (st.estagio === 1 && !p.conhecido.risco.includes(id) && (id !== 'dep' || rnd(s) < 0.5)) {
      p.conhecido.risco.push(id);
      achados.push(`Sinais de risco para ${c.nome.toLowerCase()} — vale orientar hábitos`);
    }
  }
  p.conhecido.suspeitas = p.conhecido.suspeitas.filter((id) => !p.cond[id].diag);
  return sucesso(achados.length ? `Consulta: ${achados.join('. ')}.` : 'Consulta sem achados novos. Hábitos atualizados.');
}

function acaoTratamento(s, cfg, pid, condId, ligar) {
  const p = achaPessoa(s, pid);
  const st = p.cond[condId];
  if (!st.diag) return falha('É preciso diagnosticar antes de tratar.');
  st.trat = ligar;
  return sucesso(ligar
    ? `Tratamento de ${cfg.cond[condId].nome.toLowerCase()} iniciado. Consome 1 insumo por mês.`
    : `Tratamento de ${cfg.cond[condId].nome.toLowerCase()} suspenso.`);
}

const FOCOS = {
  atividade: 'Atividade física', alimentacao: 'Alimentação', sono: 'Sono', fumo: 'Parar de fumar', estresse: 'Manejo do estresse',
};

function acaoOrientar(s, cfg, pid, foco) {
  const p = achaPessoa(s, pid);
  const f = familiaDe(s, p);
  if (p.internado) return falha(`${p.nome} está internado(a).`);
  if (!gasta(s, cfg.game.custos.orientar)) return falha('Sem horas de equipe suficientes neste mês.');
  f.vinculo = clamp(f.vinculo + 3, 0, 100);
  if (foco === 'fumo') {
    if (!p.tabagismo) { s.tempo += cfg.game.custos.orientar; return falha('Esta pessoa não fuma.'); }
    if (rnd(s) < 0.25 + 0.3 * (f.vinculo / 100)) { p.tabagismo = false; lembraHabitos(p); return sucesso(`${p.nome} parou de fumar! (com apoio e vínculo, a chance aumenta)`); }
    return sucesso('Orientação feita. Parar de fumar costuma exigir várias tentativas — continue apoiando.');
  }
  if (foco === 'estresse') p.habitos.estresse = clamp(p.habitos.estresse - 12, 0, 100);
  else p.habitos[foco] = clamp(p.habitos[foco] + 12, 0, 100);
  lembraHabitos(p);
  return sucesso(`Orientação sobre ${FOCOS[foco].toLowerCase()} feita (vínculo +3).`);
}

function acaoMutirao(s, cfg) {
  if (s.mutiraoTurno === s.turno) return falha('O mutirão já foi realizado neste mês.');
  if (!gasta(s, cfg.game.custos.mutirao)) return falha('Sem horas de equipe suficientes neste mês.');
  s.mutiraoTurno = s.turno;
  const ef = cfg.game.dengue.mutiraoEfeito + 4 * s.predios.vigilancia;
  s.infestacao = clamp(s.infestacao - ef, 0, 100);
  for (const f of s.familias) f.vinculo = clamp(f.vinculo + 2, 0, 100);
  return sucesso(`Mutirão contra focos do mosquito realizado: infestação −${ef} (vínculo +2 em todas as famílias).`);
}

function acaoObra(s, cfg, id) {
  const b = cfg.game.predios[id];
  const nivel = s.predios[id];
  if (s.obra) return falha('Já existe uma obra em andamento — só uma por vez.');
  if (nivel >= b.custo.length) return falha('Nível máximo.');
  const custo = b.custo[nivel];
  if (s.verba < custo) return falha('Verba insuficiente.');
  s.verba -= custo;
  s.obra = { id, meses: b.meses[nivel] };
  return sucesso(`Obra iniciada: ${b.nome} (nível ${nivel + 1}) — ${b.meses[nivel]} mês(es).`);
}

/* ---------- Indicadores ---------- */

function indicadores(s, cfg) {
  const pess = todasPessoas(s);
  const adultos = pess.filter((p) => p.idade >= 18);
  const rastreados = adultos.filter((p) => p.conhecido.medidasTurno !== null && s.turno - p.conhecido.medidasTurno < 12);
  const frac = (num, den) => (den === 0 ? null : num / den);
  const ctrlDe = (id) => {
    const d = pess.filter((p) => p.cond[id].diag);
    return { total: d.length, bons: d.filter((p) => p.cond[id].trat && p.cond[id].ctrl).length };
  };
  const has = ctrlDe('has'), dm = ctrlDe('dm'), dep = ctrlDe('dep');
  const interAno = s.internacoes.filter((t) => s.turno - t < 12).length;
  const vinculoMedio = s.familias.reduce((a, f) => a + f.vinculo, 0) / s.familias.length / 100;
  const partes = [
    frac(rastreados.length, adultos.length),
    frac(has.bons, has.total), frac(dm.bons, dm.total), frac(dep.bons, dep.total),
    1 - Math.min(1, interAno / 4), vinculoMedio,
  ].filter((v) => v !== null);
  const score = partes.reduce((a, v) => a + v, 0) / partes.length;
  const liga = score >= 0.85 ? 'Cristal' : score >= 0.65 ? 'Ouro' : score >= 0.4 ? 'Prata' : 'Bronze';
  return {
    rastreamento: frac(rastreados.length, adultos.length),
    has: frac(has.bons, has.total), hasTotal: has.total,
    dm: frac(dm.bons, dm.total), dmTotal: dm.total,
    dep: frac(dep.bons, dep.total), depTotal: dep.total,
    internacoesAno: interAno, vinculoMedio, score, liga,
  };
}

/* ---------- Passagem do mês ---------- */

function avancarMes(s, cfg) {
  const G = cfg.game, D = G.dengue;
  const saida = [];
  const add = (tipo, texto, extra = {}) => {
    const e = { mes: s.mes, ano: s.ano, tipo, texto, ...extra };
    s.diario.push(e);
    saida.push(e);
  };
  const licao = (chave, titulo, texto) => {
    if (s.licoes[chave]) return;
    s.licoes[chave] = true;
    add('aprendizado', `${titulo} — ${texto}`);
  };
  const internar = (p, motivo) => {
    p.internado = true;
    const f = familiaDe(s, p);
    f.vinculo = clamp(f.vinculo - 6, 0, 100);
    s.verba = Math.max(0, s.verba - G.economia.custoInternacao);
    s.internacoes.push(s.turno);
    add('alerta', `🏥 ${p.nome} ${motivo}. (custo de internação: −${G.economia.custoInternacao} de verba)`, { pessoaId: p.id });
  };

  // 0. altas hospitalares do mês anterior
  for (const p of todasPessoas(s)) if (p.internado) {
    p.internado = false;
    add('info', `${p.nome} teve alta e precisa de acompanhamento na unidade.`, { pessoaId: p.id });
  }

  // 1. desfecho da dengue do mês anterior
  for (const p of todasPessoas(s)) {
    if (!p.dengue.ativa) continue;
    const idoso = p.idade >= 65 || p.idade < 5;
    const comorb = (p.cond.has.diag || p.cond.dm.diag) ? 1.3 : 1;
    const pg = (p.dengue.atendido ? D.pGraveComAtendimento : D.pGraveSemAtendimento) * (idoso ? 1.8 : 1) * comorb;
    p.dengue = { ativa: false, atendido: false };
    p.imune = D.imunidadeMeses;
    if (rnd(s) < pg) {
      internar(p, 'evoluiu para dengue grave e foi internado(a)');
      licao('dengue', '💡 Dengue', cfg.cond.dengue.licao);
    } else {
      add('bom', `${p.nome} se recuperou da dengue.`, { pessoaId: p.id });
    }
  }

  // 2. tratamento: insumos e adesão
  let precisam = 0, faltou = 0, naoAderiu = 0;
  for (const f of s.familias) for (const p of f.pessoas) for (const id of CONDS) {
    const st = p.cond[id];
    st.ctrl = false;
    if (!st.trat || !st.diag) continue;
    precisam++;
    if (s.insumos < 1) { faltou++; continue; }
    s.insumos -= 1;
    if (rnd(s) < adesao(f)) st.ctrl = true; else naoAderiu++;
  }
  if (faltou > 0) add('alerta', `💊 Faltou medicamento/insumo para ${faltou} tratamento(s) neste mês. Melhore a farmácia da unidade.`);
  if (naoAderiu > 0) add('info', `${naoAderiu} tratamento(s) não foram seguidos direito — vínculo e orientação aumentam a adesão.`);

  // 3. progressão das doenças crônicas
  for (const f of s.familias) for (const p of f.pessoas) {
    if (p.internado) continue;
    for (const id of CONDS) {
      const c = cfg.cond[id], st = p.cond[id];
      if (p.idade < c.idadeMin) continue;
      const z = riskZ(p, c, id);
      const m = G.ritmo * Math.exp(c.prog.k * z);
      if (st.estagio === 0) {
        if (rnd(s) < c.prog.p01 * m) st.estagio = 1;
      } else if (st.estagio === 1) {
        const protecao = (p.habitos.atividade + p.habitos.alimentacao) / 200;
        if (rnd(s) < c.prog.p12 * m) st.estagio = 2;
        else if (rnd(s) < 0.05 * protecao * protecao) st.estagio = 0;
      } else if (st.estagio === 2) {
        const fator = st.ctrl ? c.prog.fatorControlado : 1;
        if (rnd(s) < c.prog.p23 * m * fator) {
          st.estagio = 3;
          st.diag = true;
          internar(p, c.evento);
          licao(id, `💡 ${c.nome}`, c.licao);
        } else if (id === 'dep' && st.ctrl && rnd(s) < c.prog.remissao) {
          st.estagio = 1;
          st.diag = false; st.trat = false;
          add('bom', `${p.nome} teve melhora importante da depressão com o acompanhamento.`, { pessoaId: p.id });
        }
      }
    }
  }

  // 4. hábitos e peso (no mundo em tempo real, os hábitos vêm do comportamento diário dos personagens)
  for (const f of s.familias) for (const p of f.pessoas) {
    if (p.idade < 12) continue;
    if (!s.tempoReal) {
      const t = f.vinculo > 60 ? 0.5 : -0.3;
      for (const k of ['atividade', 'alimentacao', 'sono']) p.habitos[k] = clamp(p.habitos[k] + rfloat(s, -3, 3) + t, 0, 100);
      p.habitos.estresse = clamp(p.habitos.estresse + rfloat(s, -3, 3), 0, 100);
    }
    if (p.cond.dep.estagio >= 2 && !p.cond.dep.ctrl) {
      p.habitos.atividade = clamp(p.habitos.atividade - 1.5, 0, 100);
      p.habitos.alimentacao = clamp(p.habitos.alimentacao - 1, 0, 100);
    }
    if (p.idade >= 18) p.imc = Math.round(clamp(p.imc + (50 - (p.habitos.atividade + p.habitos.alimentacao) / 2) / 400, 17, 45) * 10) / 10;
  }

  // 5. novos casos de dengue
  const emTemporada = D.estacao.includes(s.mes);
  const pInf = Math.pow(s.infestacao / 100, 1.5) * D.ataque;
  let casos = 0, notificados = 0;
  for (const f of s.familias) for (const p of f.pessoas) {
    if (p.imune > 0) { p.imune -= 1; continue; }
    if (p.internado) continue;
    if (rnd(s) < pInf) {
      p.dengue = { ativa: true, atendido: false };
      casos++;
      if (f.vinculo >= 50) {
        notificados++;
        add('alerta', `🦟 ${p.nome} procurou a unidade com febre e dor no corpo (suspeita de dengue).`, { pessoaId: p.id });
      }
    }
  }
  if (casos >= 2) add('alerta', `🦟 Vigilância: aumento de casos suspeitos no território (${casos} novos). Atenção às famílias de menor vínculo — elas podem não procurar a unidade.`);
  if (casos > 0 && notificados === 0) add('info', 'A vigilância recebeu sinais de febre no bairro. Visitas domiciliares ajudam a encontrar quem não veio à unidade.');
  if (casos > 0) licao('dengue-surto', '💡 Vigilância', 'Quem tem pouco vínculo com a unidade tende a procurar atendimento só quando o quadro piora. Visitas domiciliares e mutirões contra focos protegem quem não vem até você.');

  // 6. ambiente: infestação
  if (emTemporada) s.infestacao = clamp(s.infestacao + rfloat(s, D.crescimentoEstacao[0], D.crescimentoEstacao[1]) * (1 - 0.25 * s.predios.vigilancia), 0, 100);
  else s.infestacao = clamp(s.infestacao - D.quedaForaEstacao, 0, 100);
  s.infestacao = Math.round(s.infestacao);

  // 7. vínculo
  for (const f of s.familias) {
    if (s.turno - f.visTurno > 2) f.vinculo -= 1;
    f.vinculo += 1.5 * s.predios.acs;
    f.vinculo = clamp(Math.round(f.vinculo * 10) / 10, 0, 100);
  }

  // 8. obra
  if (s.obra) {
    s.obra.meses -= 1;
    if (s.obra.meses <= 0) {
      s.predios[s.obra.id] += 1;
      add('bom', `🔨 Obra concluída: ${G.predios[s.obra.id].nome} (nível ${s.predios[s.obra.id]}).`);
      s.obra = null;
    }
  }

  // 9. economia e relógio
  const ind = indicadores(s, cfg);
  const bonus = Math.round(G.economia.verbaBonus * ind.score);
  s.verba += G.economia.verbaBase + bonus;
  s.insumos = Math.min(G.economia.insumosCap, s.insumos + G.insumosBase + G.insumosPorNivel * s.predios.farmacia);
  s.mes += 1;
  s.turno += 1;
  if (s.mes === 12) {
    s.mes = 0; s.ano += 1;
    for (const p of todasPessoas(s)) p.idade += 1;
    const i = indicadores(s, cfg);
    add('info', `📅 Balanço do ano: liga ${i.liga} · ${s.internacoes.filter((t) => s.turno - t < 12).length} internação(ões) · vínculo médio ${Math.round(i.vinculoMedio * 100)}%.`);
  }
  s.tempoMax = tempoMaximo(s, cfg);
  s.tempo = s.tempoMax;
  s.ultimoRelatorio = saida;
  return saida;
}

// Mundo em tempo real (estilo "vida simulada"): mapa, personagens que andam, necessidades, rotina e equipe da UBS.
// Sem DOM. Os desfechos de saúde continuam sendo calculados pelo motor (engine.js); aqui nasce o comportamento
// (hábitos) e acontecem as ações da equipe (deslocamento, fila, atendimento) que antes eram instantâneas.

const CAMINHAVEL = new Set(['.', ',', 'c', 'F', '_', '+']);
const MIN_DIA = 1440;
const DIAS_MES = 30;
const DIAS_SEMANA = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];

/* ---------- Configuração por cenário ---------- */

function mesclar(a, b) {
  for (const k of Object.keys(b || {})) {
    if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])) a[k] = mesclar(a[k] && typeof a[k] === 'object' ? a[k] : {}, b[k]);
    else a[k] = b[k];
  }
  return a;
}

/** Junta regras gerais + cenário escolhido: { game, cond, territorio, cenario, modelos, objetos, ... } */
function montarCfg(base, id) {
  const c = base.cenarios.cenarios[id];
  const game = mesclar(JSON.parse(JSON.stringify(base.game)), c.game);
  return {
    game, cond: base.cond, territorio: c.territorio, cenario: { id, ...c },
    modelos: base.cenarios.modelos, objetos: base.cenarios.objetos, terreno: base.cenarios.terreno, pisos: base.cenarios.pisos,
  };
}

/* ---------- Tempo ---------- */

const diaDoJogo = (s) => Math.floor(s.mundo.min / MIN_DIA);
const diaSemana = (s) => (diaDoJogo(s) + 1) % 7; // o jogo começa numa terça-feira
const minutoDoDia = (s) => s.mundo.min % MIN_DIA;
function rotuloRelogio(s) {
  const m = Math.floor(minutoDoDia(s));
  return `${DIAS_SEMANA[diaSemana(s)]} ${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
}
const diaDoMes = (s) => (diaDoJogo(s) % DIAS_MES) + 1;

/** Minutos de jogo por segundo real a 1×: devagar no expediente (7h–17h), mais rápido à noite. */
function minutosPorSegundo(s) {
  const h = minutoDoDia(s) / 60;
  if (h >= 7 && h < 17) return 3;
  if (h >= 17 && h < 22) return 5;
  return 12;
}

/* ---------- Mapa ---------- */

function construirMapa(cfg) {
  const m = cfg.cenario.mapa;
  const { w, h } = m;
  const idx = (x, y) => y * w + x;
  const terr = new Array(w * h).fill(m.base);
  const piso = new Array(w * h).fill(null);
  const objs = [];
  const casas = {};
  let ubs = null;
  const lugares = [];

  for (const r of m.retangulos || []) {
    for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) if (x >= 0 && y >= 0 && x < w && y < h) terr[idx(x, y)] = r.c;
  }
  for (const s of m.carimbos) {
    const mod = cfg.modelos[s.m];
    const linhas = [...mod.linhas];
    if (s.flip) linhas.reverse();
    const info = { modelo: s.m, x: s.x, y: s.y, w: linhas[0].length, h: linhas.length, casa: s.casa || null, porta: null, piso: cfg.pisos[mod.piso] };
    linhas.forEach((ln, j) => {
      for (let i = 0; i < ln.length; i++) {
        const ch = ln[i], x = s.x + i, y = s.y + j, k = idx(x, y);
        if (ch === ' ') continue;
        if (ch === '#') { terr[k] = '#'; continue; }
        piso[k] = cfg.pisos[mod.piso];
        if (ch === '+') {
          terr[k] = '+';
          if (j === 0 || j === linhas.length - 1) {
            const dir = j === 0 ? -1 : 1;
            info.porta = { x, y, fora: { x, y: y + dir }, dentro: { x, y: y - dir } };
          }
        } else if (ch === '_') terr[k] = '_';
        else if (cfg.objetos[ch]) { terr[k] = '_'; objs.push({ t: ch, x, y, casa: s.casa || null, lugar: s.m }); }
      }
    });
    if (s.casa) casas[s.casa] = info;
    if (s.m === 'ubs') ubs = info;
    lugares.push(info);
  }
  for (const o of m.objetos || []) objs.push({ t: o.t, x: o.x, y: o.y, casa: null, lugar: 'publico' });

  const bloq = new Uint8Array(w * h);
  for (let k = 0; k < w * h; k++) if (!CAMINHAVEL.has(terr[k])) bloq[k] = 1;
  for (const o of objs) bloq[idx(o.x, o.y)] = 1;

  const porTipo = {};
  for (const o of objs) (porTipo[o.t] = porTipo[o.t] || []).push(o);
  return { w, h, terr, piso, objs, casas, ubs, lugares, bloq, porTipo };
}

const caminhavel = (W, x, y) => x >= 0 && y >= 0 && x < W.w && y < W.h && !W.bloq[y * W.w + x];

/** Tiles caminháveis vizinhos de um objeto (de onde ele pode ser usado). */
function pontosDeUso(W, o) {
  if (o.pontos) return o.pontos;
  o.pontos = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => ({ x: o.x + dx, y: o.y + dy })).filter((q) => caminhavel(W, q.x, q.y));
  return o.pontos;
}

/** Busca em largura até o alvo mais próximo. Devolve a lista de tiles (sem o ponto de partida) ou null. */
function caminhoAte(W, sx, sy, alvos) {
  const { w, h } = W;
  const objetivo = new Set(alvos.map((q) => q.y * w + q.x));
  const ini = Math.round(sy) * w + Math.round(sx);
  if (objetivo.has(ini)) return [];
  const prev = new Int32Array(w * h).fill(-2);
  prev[ini] = -1;
  const fila = [ini];
  for (let qi = 0; qi < fila.length; qi++) {
    const c = fila[qi];
    const cx = c % w, cy = (c / w) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const k = ny * w + nx;
      if (prev[k] !== -2 || W.bloq[k]) continue;
      prev[k] = c;
      if (objetivo.has(k)) {
        const rota = [];
        for (let t = k; t !== ini; t = prev[t]) rota.push({ x: t % w, y: (t / w) | 0 });
        return rota.reverse();
      }
      fila.push(k);
    }
  }
  return null;
}

/* ---------- Estado persistente do mundo (dentro de S.mundo) ---------- */

const NECESSIDADES = ['fome', 'energia', 'higiene', 'disp', 'humor'];
const ROTULO_NEC = { fome: ['🍽️', 'Fome'], energia: ['😴', 'Energia'], higiene: ['🚿', 'Higiene'], disp: ['🏃', 'Disposição'], humor: ['😊', 'Humor'] };

function contadoresNovos() {
  return { exMin: 0, sedMin: 0, saudavel: 0, fast: 0, sonoMin: 0, humorSoma: 0, humorN: 0, trabMin: 0, cafe: false, almoco: false, jantar: false };
}

function iniciarEstadoMundo(S) {
  const M = { v: 1, min: 6 * 60, rng: (S.seed ^ 0x9e3779b9) >>> 0 || 7, needs: {}, dia: {}, intencao: {}, fumar: {} };
  for (const p of todasPessoas(S)) {
    M.needs[p.id] = { fome: rint(M, 60, 95), energia: rint(M, 70, 100), higiene: rint(M, 60, 95), disp: rint(M, 50, 90), humor: rint(M, 55, 90) };
    M.dia[p.id] = contadoresNovos();
    M.intencao[p.id] = { atividade: 0, alimentacao: 0, sono: 0, estresse: 0 };
    M.fumar[p.id] = 8 * 60 + rint(M, 0, 120);
  }
  S.mundo = M;
}

/* ---------- Criação do mundo em execução (não é salvo; é reconstruído) ---------- */

function criarMundo(S, cfg) {
  const W = construirMapa(cfg);
  W.agentes = [];
  W.ordens = [];
  W.tarefasACS = [];
  W.ubsFila = { triagem: [], consulta: [] };
  W.vel = cfg.cenario.mundo.velocidade || 1;
  W.msgs = [];
  W.relatorio = null;
  W.sinal = 0;
  for (const f of S.familias) for (const p of f.pessoas) W.agentes.push(novoAgente('res', p.id, { pid: p.id }));
  sincronizarEquipe(W, S);
  for (const a of W.agentes) if (a.k === 'res') posicionarEmCasa(W, S, a);
  return W;
}

function novoAgente(k, id, extra) {
  return { k, id, x: 0, y: 0, path: [], acao: null, pend: null, facing: 1, vis: false, espera: null, atend: null, tarefa: null, ...extra };
}

function numMedicos(S) { return 1 + (S.predios.consultorio >= 1 ? 1 : 0); }
function numACS(S) { return 1 + S.predios.acs; }
const duracaoConsulta = (S) => 30 - 5 * Math.max(0, S.predios.consultorio - 1);

function sincronizarEquipe(W, S) {
  const quer = [['tecnico', 1], ['medico', numMedicos(S)], ['acs', numACS(S)]];
  for (const [papel, n] of quer) {
    for (let i = 0; i < n; i++) {
      const id = `${papel}-${i}`;
      if (!W.agentes.some((a) => a.id === id)) W.agentes.push(novoAgente('staff', id, { papel, ind: i }));
    }
  }
}

function posicionarEmCasa(W, S, a) {
  const casa = W.casas[achaPessoa(S, a.pid).familiaId];
  const q = casa.porta.dentro;
  a.x = q.x; a.y = q.y; a.path = []; a.acao = null; a.pend = null; a.vis = true;
}

/* ---------- Utilidades ---------- */

const hash = (t) => { let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0; return h; };

function objetosDe(W, tipo, casa) {
  return (W.porTipo[tipo] || []).filter((o) => (casa === undefined ? true : casa ? o.casa === casa : o.casa === null));
}

function irPara(W, a, alvos) {
  const rota = caminhoAte(W, a.x, a.y, alvos);
  if (!rota) return false;
  a.path = rota;
  return true;
}

function escolhe(M, opcoes) {
  const total = opcoes.reduce((t, [, w]) => t + w, 0);
  let r = rnd(M) * total;
  for (const [k, w] of opcoes) { r -= w; if (r <= 0) return k; }
  return opcoes[0][0];
}

function ubsAberta(W, S, cfg, medico = false) {
  const [ini, fim] = cfg.cenario.mundo.expediente;
  const m = minutoDoDia(S), dow = diaSemana(S);
  if (dow > 4 || m < ini * 60 || m >= fim * 60) return false;
  if (medico && !cfg.cenario.mundo.medicoDias.includes(dow)) return false;
  return true;
}

const ACOES = {
  dormir: { ic: '💤', rot: 'Dormindo', obj: 'B', casa: true, dur: 720, max: 720, ef: (n, dt) => { n.energia += 0.1 * dt; n.fome -= 0.02 * dt; }, fim: (n) => n.energia >= 97, cont: 'sonoMin' },
  descansar: { ic: '🤒', rot: 'Acamado(a), com febre', obj: 'B', casa: true, dur: 240, ef: (n, dt) => { n.energia += 0.03 * dt; n.humor -= 0.02 * dt; } },
  banho: { ic: '🚿', rot: 'Tomando banho', obj: 'C', casa: true, dur: 15, ef: (n, dt) => { n.higiene += 6 * dt; } },
  comer: { ic: '🍳', rot: 'Refeição caseira', obj: 'G', casa: true, dur: 25, ef: (n, dt) => { n.fome += 3.6 * dt; }, fimC: (c, p, int, M) => { if (rnd(M) < clamp(0.3 + 0.65 * p.habitos.alimentacao / 100 + 0.4 * int.alimentacao, 0, 0.98)) c.saudavel++; else c.fast++; } },
  lanche: { ic: '🍔', rot: 'Comendo na lanchonete', obj: 'L', dur: 20, ef: (n, dt) => { n.fome += 4.5 * dt; n.humor += 0.4 * dt; }, fimC: (c) => { c.fast++; } },
  tv: { ic: '📺', rot: 'Descansando na TV', obj: 'S', casa: true, dur: 60, ef: (n, dt) => { n.humor += 0.18 * dt; n.disp -= 0.04 * dt; }, cont: 'sedMin' },
  praca: { ic: '🚶', rot: 'Passeando na praça', obj: 'P', dur: 45, ef: (n, dt) => { n.disp += 0.5 * dt; n.humor += 0.25 * dt; }, cont: 'exMin' },
  academia: { ic: '🏋️', rot: 'Exercitando-se', obj: 'A', dur: 40, ef: (n, dt) => { n.disp += 0.8 * dt; n.humor += 0.2 * dt; }, cont: 'exMin' },
  trabalho: { ic: '💼', rot: 'Trabalhando', obj: 'O', dur: 0, ef: (n, dt) => { n.disp -= 0.03 * dt; n.humor -= 0.04 * dt; }, cont: 'trabMin' },
  roca: { ic: '🌽', rot: 'Trabalhando na roça', obj: 'R', dur: 0, ef: (n, dt) => { n.disp += 0.1 * dt; n.humor -= 0.03 * dt; n.fome -= 0.02 * dt; }, cont: 'trabMin', exLeve: 0.15 },
  escola: { ic: '📚', rot: 'Na escola', obj: 'E', dur: 0, ef: (n, dt) => { n.humor += 0.02 * dt; }, cont: 'trabMin' },
  fumar: { ic: '🚬', rot: 'Fumando', dur: 6, local: 'porta', ef: (n, dt) => { n.humor += 0.8 * dt; } },
  conversar: { ic: '💬', rot: 'Conversando', dur: 30, local: 'rua', ef: (n, dt) => { n.humor += 0.3 * dt; n.disp += 0.12 * dt; }, cont: 'exMin', exLeve: 0.3 },
};
const ROTULO_ACAO = Object.fromEntries(Object.entries(ACOES).map(([k, v]) => [k, v.rot]));

/* ---------- Decisão dos moradores ---------- */

function decidir(W, S, cfg, a, p, f, n, c, int) {
  const M = S.mundo, m = minutoDoDia(S), dow = diaSemana(S), util = dow < 5;
  const oc = p.ocupacao || 'casa';
  const mundo = cfg.cenario.mundo;
  const temLanche = (W.porTipo.L || []).length > 0;

  // 1) atendimento marcado pelo jogador (ou procura espontânea)
  const ord = W.ordens.find((o) => o.pid === p.id);
  if (ord && ord.estado === 'pendente' && !(a.acao && a.acao.k === 'dormir')) {
    const abre = ubsAberta(W, S, cfg, ord.tipo === 'consulta') && m >= mundo.expediente[0] * 60 + 15 && m < mundo.expediente[1] * 60 - 60;
    if (abre) {
      if (!ord.rolou) {
        ord.rolou = true;
        if (!ord.espontaneo && rnd(M) > adesao(f)) {
          W.ordens.splice(W.ordens.indexOf(ord), 1);
          avisar(W, S, `${p.nome} não compareceu à unidade (vínculo baixo: é mais difícil ir). Uma visita ajuda.`, 'info');
          return null;
        }
      }
      ord.estado = 'indo';
      return { k: 'ubs', ord };
    }
  }
  if (p.dengue.ativa && f.vinculo >= 50 && !a.procurou && !ord) {
    a.procurou = true;
    W.ordens.push({ pid: p.id, tipo: 'consulta', estado: 'pendente', espontaneo: true, rolou: false });
  }

  // 2) doente: repouso em casa
  if (p.dengue.ativa) return { k: 'descansar' };

  // 3) sono
  const dormeAs = 22 * 60 + Math.round(((100 - p.habitos.sono) / 100) * 150) - Math.round(60 * int.sono);
  const noite = m >= dormeAs || m < 5 * 60;
  if ((noite && n.energia < 97) || n.energia < 18) return { k: 'dormir' };

  // 4) higiene e refeições
  if (n.higiene < 35 || (m >= 6 * 60 && m < 8 * 60 && n.higiene < 80)) return { k: 'banho' };
  if (m >= 6 * 60 && m < 9 * 60 && !c.cafe && n.fome < 85) { c.cafe = true; return { k: 'comer' }; }
  if (m >= 12 * 60 && m < 14 * 60 && !c.almoco && n.fome < 92) {
    c.almoco = true;
    const pFast = clamp(((100 - p.habitos.alimentacao) / 100) * 0.9 - int.alimentacao * 0.5, 0, 0.9);
    if (temLanche && mundo.almoco === 'lanchonete' && rnd(M) < Math.max(0.15, pFast)) return { k: 'lanche' };
    return { k: 'comer' };
  }
  if (m >= 19 * 60 && m < 21 * 60 && !c.jantar && n.fome < 92) { c.jantar = true; return { k: 'comer' }; }
  if (n.fome < 25) return { k: 'comer' };

  // 5) cigarro
  if (p.tabagismo && m >= M.fumar[p.id] && m < 22 * 60) { M.fumar[p.id] = m + 150 + rint(M, 0, 60); return { k: 'fumar' }; }

  // 6) trabalho e escola
  if (util && oc === 'trabalho' && !p.dengue.ativa) {
    if (m >= 7.5 * 60 && m < 12 * 60) return { k: mundo.trabalho === 'R' ? 'roca' : 'trabalho', fim: 12 * 60 };
    if (m >= 13 * 60 && m < 17 * 60) return { k: mundo.trabalho === 'R' ? 'roca' : 'trabalho', fim: 17 * 60 };
  }
  if (util && oc === 'escola' && m >= 7 * 60 && m < 12 * 60) return { k: 'escola', fim: 12 * 60 };

  // 7) lazer
  if (m < 6 * 60 + 30 || m >= 22 * 60) return { k: 'tv' };
  const temPraca = objetosDe(W, 'P', null).length > 0, temAcad = objetosDe(W, 'A', null).length > 0;
  const ativ = p.habitos.atividade / 100 + int.atividade * 0.8;
  // exercício ao ar livre: horários mais frescos e teto diário (ninguém passa o dia inteiro na praça)
  const fresco = (m >= 6.5 * 60 && m < 10 * 60) || (m >= 16 * 60 && m < 20 * 60);
  const fatorEx = (fresco ? 1 : 0.15) * (c.exMin >= 60 ? 0.1 : 1) * (!util ? 1.3 : 1);
  const op = [['tv', 0.9 + (1 - ativ) * 1.6 + (n.humor < 40 ? 0.5 : 0)]];
  if (temPraca) op.push(['praca', (0.15 + ativ * 0.9) * fatorEx]);
  if (temAcad && p.idade >= 14) op.push(['academia', (0.05 + ativ * 0.6 + int.atividade * 0.6) * fatorEx]);
  if (!temPraca) op.push(['conversar', (0.2 + ativ * 0.9) * fatorEx]);
  if (temLanche && mundo.almoco === 'lanchonete' && m >= 17 * 60 && p.idade >= 14) op.push(['lanche', 0.1 + ((100 - p.habitos.alimentacao) / 100) * 0.8 - int.alimentacao * 0.4]);
  if (p.idade < 12) return { k: escolhe(M, [['tv', 1], ['praca', temPraca ? 0.9 * fatorEx : 0], ['conversar', temPraca ? 0 : 0.8 * fatorEx]]) };
  return { k: escolhe(M, op.map(([k, w]) => [k, Math.max(0.02, w)])) };
}

function avisar(W, S, texto, tipo = 'info', extra = {}) {
  W.msgs.push({ texto, tipo });
  S.diario.push({ mes: S.mes, ano: S.ano, tipo, texto, ...extra });
}

/** Define a rota até um dos alvos; se já está lá, "chega" na hora. */
function partir(W, S, cfg, a, p, alvos) {
  if (!irPara(W, a, alvos)) return false;
  if (!a.path.length) chegada(W, S, cfg, a, p);
  return true;
}

/** Começa a executar uma decisão: escolhe o objeto/local, calcula a rota. */
function iniciarDecisao(W, S, cfg, a, p, d) {
  if (d.k === 'ubs') {
    const alvos = objetosDe(W, 'H', null).flatMap((o) => pontosDeUso(W, o));
    a.pend = { k: 'ubs', ord: d.ord };
    if (!partir(W, S, cfg, a, p, alvos)) { a.pend = null; d.ord.estado = 'pendente'; }
    return;
  }
  const def = ACOES[d.k];
  const dur = d.dur || def.dur || 30;
  const semLocal = () => { a.pend = null; a.acao = { k: d.k, restante: Math.min(30, dur), sem: true }; };
  if (def.obj) {
    const casa = def.casa ? p.familiaId : null;
    let lista = objetosDe(W, def.obj, casa);
    if (!lista.length && def.obj === 'S') lista = objetosDe(W, 'B', casa);
    if (!lista.length) return semLocal();
    const o = def.casa ? lista[hash(p.id + d.k) % lista.length] : lista[hash(p.id) % lista.length];
    a.pend = { k: d.k, dur, fim: d.fim, obj: o };
    if (!partir(W, S, cfg, a, p, pontosDeUso(W, o))) semLocal();
    return;
  }
  if (def.local === 'porta') {
    a.pend = { k: d.k, dur };
    if (!partir(W, S, cfg, a, p, [W.casas[p.familiaId].porta.fora])) semLocal();
    return;
  }
  if (def.local === 'rua') {
    const q = pontoAleatorio(W, S.mundo, a);
    a.pend = { k: d.k, dur, andar: true };
    if (!q || !partir(W, S, cfg, a, p, [q])) semLocal();
  }
}

function pontoAleatorio(W, M, a) {
  for (let t = 0; t < 40; t++) {
    const x = clamp(Math.round(a.x) + rint(M, -9, 9), 0, W.w - 1), y = clamp(Math.round(a.y) + rint(M, -9, 9), 0, W.h - 1);
    const k = y * W.w + x;
    if (!W.bloq[k] && (W.terr[k] === '.' || W.terr[k] === ',' || W.terr[k] === 'c')) return { x, y };
  }
  return null;
}

/* ---------- Passo de cada tipo de agente ---------- */

function mover(a, dt, vel) {
  let d = vel * dt;
  while (d > 0 && a.path.length) {
    const t = a.path[0];
    const dx = t.x - a.x, dy = t.y - a.y, dist = Math.hypot(dx, dy);
    if (dx) a.facing = dx > 0 ? 1 : -1;
    if (dist <= d) { a.x = t.x; a.y = t.y; a.path.shift(); d -= dist; } else { a.x += (dx / dist) * d; a.y += (dy / dist) * d; d = 0; }
  }
}

function passoMorador(W, S, cfg, a, dt) {
  const p = achaPessoa(S, a.pid), f = achaFamilia(S, p.familiaId), M = S.mundo;
  const n = M.needs[a.pid], c = M.dia[a.pid], int = M.intencao[a.pid];
  if (p.internado) { a.vis = false; a.path = []; a.acao = null; a.pend = null; a.espera = null; a.atend = null; limparOrdens(W, p.id); return; }
  if (!a.vis) { posicionarEmCasa(W, S, a); }

  // necessidades
  const dormindo = a.acao && (a.acao.k === 'dormir');
  n.fome -= (dormindo ? 0.02 : 0.065) * dt;
  if (!dormindo) n.energia -= 0.05 * dt;
  n.higiene -= 0.03 * dt;
  n.disp -= 0.03 * dt;
  const media = (n.fome + n.energia + n.higiene + n.disp) / 4;
  n.humor += (media - n.humor) * 0.004 * dt;
  if (p.cond.dep.estagio >= 2 && !p.cond.dep.ctrl) n.humor -= 0.02 * dt;
  if (!dormindo) c.sedMin += (a.path.length ? 0 : dt);

  if (a.path.length) {
    mover(a, dt, W.vel);
    c.exMin += dt * 0.25; // deslocamento a pé conta como atividade leve
    if (a.pend && a.pend.andar) c.exMin += dt * 0.5;
    if (!a.path.length) chegada(W, S, cfg, a, p);
  } else if (a.atend) {
    // esperando o profissional (a lógica da UBS controla o tempo)
    n.humor -= 0.005 * dt;
  } else if (a.espera) {
    n.humor -= 0.01 * dt; // ficar na fila cansa
  } else if (a.acao) {
    const def = ACOES[a.acao.k];
    if (def.ef) def.ef(n, dt);
    if (def.cont) c[def.cont] += dt * (def.cont === 'exMin' ? 1 : 1);
    if (def.exLeve) c.exMin += dt * def.exLeve;
    a.acao.restante -= dt;
    const alarme = a.acao.k === 'dormir' && minutoDoDia(S) >= 6 * 60 && minutoDoDia(S) < 12 * 60 && diaSemana(S) < 5 && ['trabalho', 'escola'].includes(p.ocupacao);
    const fim = alarme || (def.fim && def.fim(n)) || a.acao.restante <= 0 || (def.max && (a.acao.t = (a.acao.t || 0) + dt) > def.max);
    if (fim) {
      if (def.fimC) def.fimC(c, p, int, M);
      if (a.acao.k === 'dormir' && minutoDoDia(S) < 5 * 60) { /* acordou cedo: segue o dia */ }
      a.acao = null;
    }
  } else {
    const d = decidir(W, S, cfg, a, p, f, n, c, int);
    if (d) iniciarDecisao(W, S, cfg, a, p, d);
    else a.acao = { k: 'tv', restante: 5, sem: true };
  }
  for (const k of NECESSIDADES) n[k] = clamp(n[k], 0, 100);
  c.humorSoma += n.humor * dt; c.humorN += dt;
}

function chegada(W, S, cfg, a, p) {
  const pend = a.pend;
  a.pend = null;
  if (!pend) return;
  if (pend.k === 'ubs') {
    const ord = pend.ord;
    ord.estado = 'espera';
    a.espera = ord;
    (W.ubsFila[ord.tipo] = W.ubsFila[ord.tipo] || []).push(a.id);
    return;
  }
  if (pend.k === 'atendido') { a.atend.pronto = true; return; }
  const def = ACOES[pend.k];
  const dur = pend.fim != null ? Math.max(5, pend.fim - minutoDoDia(S)) : (pend.dur || def.dur || 30);
  a.acao = { k: pend.k, restante: dur, obj: pend.obj };
}

function limparOrdens(W, pid) {
  W.ordens = W.ordens.filter((o) => o.pid !== pid);
  for (const k of Object.keys(W.ubsFila)) W.ubsFila[k] = W.ubsFila[k].filter((id) => id !== pid);
}

/* ---------- Equipe da UBS ---------- */

function postoDe(W, papel, ind) {
  if (papel === 'tecnico') {
    const o = (W.porTipo.U || [])[0];
    return o ? pontosDeUso(W, o) : [];
  }
  if (papel === 'medico') {
    const o = (W.porTipo.D || [])[ind] || (W.porTipo.D || [])[0];
    return o ? pontosDeUso(W, o) : [];
  }
  const p = W.ubs.porta.fora;
  return [{ x: p.x + ind - 1, y: p.y }];
}

function passoEquipe(W, S, cfg, a, dt) {
  const abertoGeral = ubsAberta(W, S, cfg);
  const deveEstar = a.papel === 'medico' ? ubsAberta(W, S, cfg, true) : abertoGeral;
  if (!a.vis) {
    if (!deveEstar) return;
    a.vis = true;
    const q = W.ubs.porta.fora;
    a.x = q.x; a.y = q.y; a.path = []; a.tarefa = null;
  }
  if (!deveEstar && !a.tarefa && !a.path.length) { a.vis = false; liberarFila(W, a); return; }
  if (a.path.length) { mover(a, dt, W.vel); return; }

  if (a.papel === 'acs') return passoACS(W, S, cfg, a, dt);

  const posto = postoDe(W, a.papel, a.ind);
  const naPosicao = posto.find((q) => q.x === a.x && q.y === a.y);
  if (!a.tarefa) {
    if (!naPosicao && posto.length) { irPara(W, a, [posto[0]]); return; }
    // próximo paciente
    const tipo = a.papel === 'tecnico' ? 'triagem' : 'consulta';
    const fila = W.ubsFila[tipo];
    for (let i = 0; i < fila.length; i++) {
      const pac = W.agentes.find((x) => x.id === fila[i]);
      if (!pac || !pac.espera || pac.atend) continue;
      fila.splice(i, 1);
      const oposto = pontosDeUso(W, a.papel === 'tecnico' ? W.porTipo.U[0] : (W.porTipo.D[a.ind] || W.porTipo.D[0])).filter((q) => !posto.length || q.x !== posto[0].x || q.y !== posto[0].y);
      const spot = oposto[0] || posto[0];
      pac.atend = { staff: a.id, spot, pronto: false, tipo };
      pac.pend = { k: 'atendido' };
      if (!irPara(W, pac, [spot]) || !pac.path.length) { pac.pend = null; pac.atend.pronto = true; }
      a.tarefa = { tipo, pac: pac.id, restante: tipo === 'triagem' ? 10 : duracaoConsulta(S), fase: 'chamando' };
      break;
    }
    return;
  }
  const t = a.tarefa;
  const pac = W.agentes.find((x) => x.id === t.pac);
  if (!pac || !pac.atend) { a.tarefa = null; return; }
  if (!naPosicao && posto.length) { if (!a.path.length) irPara(W, a, [posto[0]]); return; }
  if (!pac.atend.pronto) return;
  t.fase = 'atendendo';
  t.restante -= dt;
  if (t.restante > 0) return;
  const p = achaPessoa(S, pac.pid);
  const r = t.tipo === 'triagem' ? acaoMedir(S, cfg, p.id) : acaoConsulta(S, cfg, p.id);
  avisar(W, S, `${t.tipo === 'triagem' ? '📏' : '🩺'} ${p.nome}: ${r.msg}`, 'info', { pessoaId: p.id });
  W.ordens = W.ordens.filter((o) => o.pid !== p.id);
  pac.espera = null; pac.atend = null; pac.pend = null;
  a.tarefa = null;
  W.sinal++;
}

function liberarFila(W) {
  for (const a of W.agentes) if (a.k === 'res' && a.espera && !a.atend) {
    a.espera.estado = 'pendente';
    a.espera = null;
  }
  W.ubsFila = { triagem: [], consulta: [] };
}

function passoACS(W, S, cfg, a, dt) {
  if (!a.tarefa) {
    if (W.tarefasACS.length && ubsAberta(W, S, cfg)) {
      a.tarefa = W.tarefasACS.shift();
      const t = a.tarefa;
      t.fase = 'indo';
      if (t.tipo === 'mutirao') {
        t.pontos = []; for (let i = 0; i < 3; i++) t.pontos.push(pontoAleatorio(W, S.mundo, { x: W.ubs.porta.fora.x, y: W.ubs.porta.fora.y }) || W.ubs.porta.fora);
        t.i = 0; irPara(W, a, [t.pontos[0]]);
      } else {
        const fam = t.tipo === 'visita' ? t.fam : achaPessoa(S, t.pid).familiaId;
        t.fam = fam;
        if (!irPara(W, a, [W.casas[fam].porta.dentro])) { a.tarefa = null; }
      }
      return;
    }
    const posto = postoDe(W, 'acs', a.ind)[0];
    if (posto && (a.x !== posto.x || a.y !== posto.y)) irPara(W, a, [posto]);
    return;
  }
  const t = a.tarefa;
  if (t.fase === 'indo') {
    t.fase = 'fazendo';
    t.restante = t.tipo === 'visita' ? 40 : t.tipo === 'orientar' ? 30 : 45;
  }
  t.restante -= dt;
  if (t.restante > 0) return;
  if (t.tipo === 'mutirao' && t.i < 2) { t.i++; t.restante = 45; irPara(W, a, [t.pontos[t.i]]); t.fase = 'indo'; return; }
  let r;
  if (t.tipo === 'visita') {
    r = acaoVisita(S, cfg, t.fam);
    avisar(W, S, `🚶 ${achaFamilia(S, t.fam).nome}: ${r.msg}`, r.ok ? 'info' : 'info');
  } else if (t.tipo === 'orientar') {
    r = acaoOrientar(S, cfg, t.pid, t.foco);
    if (r.ok && t.foco !== 'fumo') {
      const it = S.mundo.intencao[t.pid]; const k = t.foco === 'estresse' ? 'estresse' : t.foco;
      if (k in it) it[k] = clamp(it[k] + 0.5, 0, 1);
    }
    avisar(W, S, `💬 ${achaPessoa(S, t.pid).nome}: ${r.msg}`, 'info', { pessoaId: t.pid });
  } else {
    r = acaoMutirao(S, cfg);
    avisar(W, S, `🧹 ${r.msg}`, r.ok ? 'bom' : 'info');
  }
  a.tarefa = null;
  W.sinal++;
}

/* ---------- Ordens do jogador ---------- */

const jaNaFilaACS = (W, tipo, chave) => W.tarefasACS.some((t) => t.tipo === tipo && (t.fam === chave || t.pid === chave)) || W.agentes.some((a) => a.tarefa && a.tarefa.tipo === tipo && (a.tarefa.fam === chave || a.tarefa.pid === chave));

function ordenarVisita(W, S, cfg, famId) {
  const f = achaFamilia(S, famId);
  if (f.visTurno === S.turno) return { ok: false, msg: 'Esta família já foi visitada neste mês.' };
  if (jaNaFilaACS(W, 'visita', famId)) return { ok: false, msg: 'O agente comunitário já vai até lá.' };
  W.tarefasACS.push({ tipo: 'visita', fam: famId });
  return { ok: true, msg: `Visita à ${f.nome} na fila do agente comunitário (${W.tarefasACS.length}).` };
}

function ordenarOrientar(W, S, cfg, pid, foco) {
  const p = achaPessoa(S, pid);
  if (p.internado) return { ok: false, msg: `${p.nome} está internado(a).` };
  if (foco === 'fumo' && !p.tabagismo) return { ok: false, msg: 'Esta pessoa não fuma.' };
  if (jaNaFilaACS(W, 'orientar', pid)) return { ok: false, msg: 'Já há uma orientação pedida para esta pessoa.' };
  W.tarefasACS.push({ tipo: 'orientar', pid, foco });
  return { ok: true, msg: `Orientação para ${p.nome} na fila do agente comunitário (${W.tarefasACS.length}).` };
}

function ordenarMutirao(W, S, cfg) {
  if (S.mutiraoTurno === S.turno) return { ok: false, msg: 'O mutirão já foi realizado neste mês.' };
  if (W.tarefasACS.some((t) => t.tipo === 'mutirao') || W.agentes.some((a) => a.tarefa && a.tarefa.tipo === 'mutirao')) return { ok: false, msg: 'O mutirão já está a caminho.' };
  W.tarefasACS.push({ tipo: 'mutirao' });
  return { ok: true, msg: 'Mutirão contra focos na fila da equipe.' };
}

function ordenarUnidade(W, S, cfg, pid, tipo) {
  const p = achaPessoa(S, pid);
  if (p.internado) return { ok: false, msg: `${p.nome} está internado(a).` };
  if (tipo === 'triagem' && p.idade < 18) return { ok: false, msg: 'A triagem de PA e glicemia é para adultos.' };
  if (W.ordens.some((o) => o.pid === pid)) return { ok: false, msg: `${p.nome} já foi chamado(a) à unidade.` };
  W.ordens.push({ pid, tipo, estado: 'pendente', rolou: false });
  const med = tipo === 'consulta' && cfg.cenario.mundo.medicoDias.length < 5 ? ' O médico atende só em alguns dias da semana.' : '';
  return { ok: true, msg: `${p.nome} foi chamado(a) para ${tipo === 'triagem' ? 'a triagem' : 'a consulta'}. Vai quando a unidade estiver aberta.${med}` };
}

/* ---------- Simulação ---------- */

function fimDoDia(W, S, cfg) {
  const M = S.mundo;
  for (const p of todasPessoas(S)) {
    const c = M.dia[p.id], int = M.intencao[p.id];
    if (p.idade >= 12 && !p.internado) {
      const humorMedio = c.humorN ? c.humorSoma / c.humorN : 70;
      const refeicoes = c.saudavel + c.fast;
      const alvo = {
        atividade: clamp(8 + c.exMin * 1.3, 0, 100),
        alimentacao: refeicoes ? (100 * c.saudavel) / refeicoes : 20,
        sono: clamp((c.sonoMin / 480) * 100, 0, 100),
        estresse: clamp(100 - humorMedio + (c.trabMin > 300 ? 8 : 0) + (cfg.cenario.mundo.estresse || 0), 0, 100),
      };
      for (const k of Object.keys(alvo)) p.habitos[k] = clamp(p.habitos[k] * 0.96 + alvo[k] * 0.04, 0, 100);
    }
    for (const k of Object.keys(int)) int[k] *= 0.96;
    M.dia[p.id] = contadoresNovos();
  }
}

function passoCurto(W, S, cfg, dt) {
  const M = S.mundo;
  const diaAntes = Math.floor(M.min / MIN_DIA);
  M.min += dt;
  for (const a of W.agentes) {
    if (a.k === 'res') passoMorador(W, S, cfg, a, dt);
    else passoEquipe(W, S, cfg, a, dt);
  }
  if (Math.floor(M.min / MIN_DIA) > diaAntes) {
    fimDoDia(W, S, cfg);
    for (const a of W.agentes) if (a.k === 'res') a.procurou = false;
    if (diaDoJogo(S) % DIAS_MES === 0) {
      W.relatorio = avancarMes(S, cfg);
      sincronizarEquipe(W, S);
      W.sinal++;
      return true;
    }
  }
  return false;
}

/** Avança o mundo `dtMin` minutos de jogo. Devolve true se um mês terminou (W.relatorio traz o resumo). */
function passoMundo(W, S, cfg, dtMin) {
  let mes = false;
  let resto = dtMin;
  while (resto > 0) {
    const dt = Math.min(2, resto);
    if (passoCurto(W, S, cfg, dt)) mes = true;
    resto -= dt;
  }
  return mes;
}

/** Avança direto até as 7h do próximo dia (sem animação). Devolve true se um mês terminou. */
function pularDia(W, S, cfg) {
  const m = minutoDoDia(S);
  let faltam = (7 * 60 - m + MIN_DIA) % MIN_DIA;
  if (faltam < 5) faltam += MIN_DIA;
  let mes = false;
  for (let r = faltam; r > 0; r -= 5) if (passoMundo(W, S, cfg, Math.min(5, r))) mes = true;
  return mes;
}

/** Avança direto até o fim do mês corrente (sem animação). */
function pularMes(W, S, cfg) {
  const alvo = (Math.floor(diaDoJogo(S) / DIAS_MES) + 1) * DIAS_MES * MIN_DIA;
  const faltam = alvo - S.mundo.min;
  let mes = false;
  for (let r = faltam; r > 0; r -= 5) if (passoMundo(W, S, cfg, Math.min(5, r))) mes = true;
  return mes;
}

/* ---------- Consultas para a interface ---------- */

function acaoAtual(W, S, a) {
  const p = achaPessoa(S, a.pid);
  if (!a.vis) return p.internado ? '🏥 Internado(a)' : '—';
  if (a.atend) return a.atend.pronto ? '🩺 Em atendimento' : '🚶 Indo ao atendimento';
  if (a.espera) return '🪑 Aguardando atendimento na unidade';
  if (a.pend && a.pend.k === 'ubs') return '🚶 A caminho da unidade';
  if (a.acao) return `${ACOES[a.acao.k].ic} ${ACOES[a.acao.k].rot}`;
  if (a.path.length) return '🚶 Andando';
  return '…';
}

function bolhaDe(W, S, a) {
  if (a.k === 'staff') return a.tarefa ? (a.tarefa.tipo === 'mutirao' ? '🧹' : a.tarefa.tipo === 'visita' ? '🏠' : a.tarefa.fase === 'atendendo' ? '🩺' : null) : null;
  const p = achaPessoa(S, a.pid);
  if (sintomasDengueVisiveis(S, p)) return '🤒';
  if (a.atend && a.atend.pronto) return '🩺';
  if (a.espera) return '⏳';
  if (a.acao && ACOES[a.acao.k]) return ACOES[a.acao.k].ic;
  const n = S.mundo.needs[a.pid];
  if (n.humor < 25) return '😞';
  return null;
}

function resumoEquipe(W, S) {
  return { acs: W.tarefasACS.length, triagem: W.ubsFila.triagem.length, consulta: W.ubsFila.consulta.length, chamados: W.ordens.length };
}

const ACOES_INFO = ACOES;

// Desenho isométrico do mundo (canvas 2D): terreno, paredes recortadas, móveis com volume, personagens animados,
// partículas, iluminação de dia/noite e câmera por toque. Nenhuma regra de jogo mora aqui.

// Compatibilidade: navegadores de celular mais antigos não têm roundRect.
if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    const raio = Math.max(0, Math.min(Array.isArray(r) ? r[0] : r || 0, w / 2, h / 2));
    this.moveTo(x + raio, y); this.arcTo(x + w, y, x + w, y + h, raio); this.arcTo(x + w, y + h, x, y + h, raio);
    this.arcTo(x, y + h, x, y, raio); this.arcTo(x, y, x + w, y, raio); this.closePath();
  };
}

const HW = 32, HH = 16; // meia-largura e meia-altura do losango do tile
const FONTE_EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const proj = (x, y, z = 0) => [(x - y) * HW, (x + y) * HH - z];

/* ---------- Cores ---------- */
function rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mistura(a, b, t) { const A = rgb(a), B = rgb(b); return `rgb(${Math.round(A[0] + (B[0] - A[0]) * t)},${Math.round(A[1] + (B[1] - A[1]) * t)},${Math.round(A[2] + (B[2] - A[2]) * t)})`; }
const claro = (h, t) => mistura(h, '#ffffff', t);
const escuro = (h, t) => mistura(h, '#000000', t);
const hashR = (t) => { let h = 2166136261; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; };
const ruido = (x, y, s = 0) => { let h = (x * 374761393 + y * 668265263 + s * 2246822519) >>> 0; h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

const PELES = ['#f6d3b3', '#eab98e', '#cf966a', '#a8714a', '#7b4b2e'];
const CABELOS = ['#2a1b12', '#47301c', '#8a5a2b', '#161616', '#c9a227', '#6b3a1e'];
const CAMISAS = ['#e06c75', '#e5a54b', '#4f9be8', '#7fc47a', '#b57be0', '#4cc3c9', '#e08f5a', '#ee86a8', '#6c7ae0'];
const CALCAS = ['#34425a', '#4a4f5c', '#5a4a3a', '#2f3e46', '#3d3b6b'];
const PAREDES_CASA = ['#f3dcbc', '#d3e6cf', '#d6e0f3', '#f4d3d4', '#ece6b9'];

function poli(ctx, pts, fill, borda) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (borda) { ctx.strokeStyle = borda; ctx.lineWidth = 1; ctx.stroke(); }
}

/** Caixa isométrica entre (x0,y0) e (x1,y1) em coordenadas de tile, de altura z0 a z1 (px). */
function caixa(ctx, x0, y0, x1, y1, z0, z1, cor, o = {}) {
  const topo = o.topo || claro(cor, 0.2), esq = o.esq || cor, dir = o.dir || escuro(cor, 0.25);
  const borda = o.borda === undefined ? 'rgba(0,0,0,.16)' : o.borda;
  const D = proj(x0, y1, z1), C = proj(x1, y1, z1), B = proj(x1, y0, z1), A = proj(x0, y0, z1);
  const Cb = proj(x1, y1, z0), Db = proj(x0, y1, z0), Bb = proj(x1, y0, z0);
  poli(ctx, [D, C, Cb, Db], esq, borda);
  poli(ctx, [B, C, Cb, Bb], dir, borda);
  poli(ctx, [A, B, C, D], topo, borda);
}
function losango(ctx, i, j, cor, borda) { poli(ctx, [proj(i, j), proj(i + 1, j), proj(i + 1, j + 1), proj(i, j + 1)], cor, borda); }
function elipse(ctx, x, y, rx, ry, cor) { ctx.fillStyle = cor; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill(); }
function rr(ctx, x, y, w, h, r, cor) { ctx.fillStyle = cor; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }

/* ---------- Preparação do mapa ---------- */
function preparaMapa(W) {
  if (W.rv) return W.rv;
  const lugarDe = new Int16Array(W.w * W.h).fill(-1);
  W.lugares.forEach((l, n) => { for (let y = l.y; y < l.y + l.h; y++) for (let x = l.x; x < l.x + l.w; x++) lugarDe[y * W.w + x] = n; });
  W.rv = { lugarDe };
  return W.rv;
}
const ehTerreno = (W, x, y, ch) => x >= 0 && y >= 0 && x < W.w && y < W.h && W.terr[y * W.w + x] === ch;

function criarRenderer(canvas, getEstado, hooks) {
  const ctx = canvas.getContext('2d');
  const cam = { x: 0, y: 0, z: 1 };
  let largura = 300, altura = 300, dpr = 1;
  let selecionado = null;
  let paredesBaixas = false;
  const ponteiros = new Map();
  let arraste = null;
  const rs = new Map(); // estado visual de cada agente (posição suavizada, fase da caminhada, direção)
  const noite = document.createElement('canvas');
  const nctx = noite.getContext('2d');

  const E = () => getEstado();

  /* ---------- Câmera ---------- */
  function limitesMundo(W) { return { x0: -W.h * HW, x1: W.w * HW, y0: -90, y1: (W.w + W.h) * HH + 30 }; }
  function limitaCamera() {
    const { W } = E();
    if (!W) return;
    const L = limitesMundo(W);
    const zMin = Math.max(0.18, Math.min(largura / (L.x1 - L.x0), altura / (L.y1 - L.y0)) * 0.98);
    cam.z = Math.max(zMin, Math.min(2.2, cam.z));
    const mL = largura / cam.z / 2, mA = altura / cam.z / 2;
    cam.x = L.x1 - L.x0 < mL * 2 ? (L.x0 + L.x1) / 2 : Math.max(L.x0 + mL - 60, Math.min(L.x1 - mL + 60, cam.x));
    cam.y = L.y1 - L.y0 < mA * 2 ? (L.y0 + L.y1) / 2 : Math.max(L.y0 + mA - 60, Math.min(L.y1 - mA + 60, cam.y));
  }
  function redimensiona() {
    dpr = Math.min(2.5, window.devicePixelRatio || 1);
    largura = canvas.clientWidth || 300;
    altura = canvas.clientHeight || 300;
    canvas.width = Math.round(largura * dpr); canvas.height = Math.round(altura * dpr);
    noite.width = canvas.width; noite.height = canvas.height;
    limitaCamera();
  }
  const paraMundo = (px, py) => ({ x: (px - largura / 2) / cam.z + cam.x, y: (py - altura / 2) / cam.z + cam.y });
  function centralizar(tx, ty, z) {
    const [sx, sy] = proj(tx + 0.5, ty + 0.5);
    cam.x = sx; cam.y = sy - 10;
    if (z) cam.z = z;
    limitaCamera();
  }
  function enquadrarUBS() {
    const { W } = E();
    if (!W) return;
    cam.z = Math.min(1, largura / 640);
    centralizar(W.ubs.x + W.ubs.w / 2 - 0.5, W.ubs.y + W.ubs.h / 2 - 0.5);
  }

  /* ---------- Terreno ---------- */
  function desenhaChao(S, W, cfg, i0, i1, j0, j1) {
    const rv = preparaMapa(W);
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const k = j * W.w + i, ch = W.terr[k], ln = rv.lugarDe[k];
      const r = ruido(i, j);
      if (ln >= 0) { // piso interno
        const l = W.lugares[ln], base = l.piso;
        if (l.modelo === 'lanche') losango(ctx, i, j, (i + j) % 2 ? '#f4d4c0' : '#d9604f', 'rgba(0,0,0,.05)');
        else if (l.modelo === 'ubs' || l.modelo === 'escola') losango(ctx, i, j, (i + j) % 2 ? base : claro(base, 0.35), 'rgba(0,0,0,.05)');
        else if (l.modelo === 'trabalho') losango(ctx, i, j, (i + j) % 2 ? '#c5cfdd' : '#bcc7d8');
        else { // madeira
          losango(ctx, i, j, mistura(base, '#a9794a', 0.12 + r * 0.1));
          ctx.strokeStyle = 'rgba(90,55,25,.22)'; ctx.lineWidth = 1; ctx.beginPath();
          for (let t = 1; t < 4; t++) { const a = proj(i + t / 4, j), b = proj(i + t / 4, j + 1); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }
          ctx.stroke();
        }
        continue;
      }
