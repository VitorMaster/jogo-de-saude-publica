  }

  const corParede = (l) => (l.casa ? PAREDES_CASA[hashR(l.casa) % PAREDES_CASA.length] : { ubs: '#f1f7f7', escola: '#f6d56b', trabalho: '#b3c0d3', lanche: '#f2a96c', farmacia: '#dff3e4' }[l.modelo] || '#d1d5db');
  const QUADRANTES_BAIXOS = [['S', 'E'], ['N', 'E'], ['N', 'W'], ['S', 'W']];

  /** Paredes finas: altas no fundo, baixas no lado da câmera (recorte), meias nas divisórias. */
  function construirParedes(W, rv, quad) {
    const M = new Malha();
    const vidrosPorLugar = new Map();
    const baixas = QUADRANTES_BAIXOS[quad];
    const T = 0.26;
    const alt = (l, i, j) => {
      if (paredesBaixas) return 0.5;
      const bordas = []; if (j === l.y) bordas.push('N'); if (j === l.y + l.h - 1) bordas.push('S'); if (i === l.x) bordas.push('W'); if (i === l.x + l.w - 1) bordas.push('E');
      if (!bordas.length) return 1.35;
      return bordas.some((b) => !baixas.includes(b)) ? 2.7 : 0.5;
    };
    const ehPar = (x, y) => { const c = terr(W, x, y); return c === '#' || c === '+'; };
    for (let j = 0; j < W.h; j++) for (let i = 0; i < W.w; i++) {
      const ch = W.terr[j * W.w + i];
      if (ch !== '#' && ch !== '+') continue;
      const ln = rv.lugarDe[j * W.w + i];
      if (ln < 0) continue;
      const l = W.lugares[ln], cor = corParede(l);
      const h = alt(l, i, j);
      const cx = i + 0.5, cz = j + 0.5;
      const L = ehPar(i - 1, j), R = ehPar(i + 1, j), U = ehPar(i, j - 1), D = ehPar(i, j + 1);
      const horiz = (L || R) && !(U || D), vert = (U || D) && !(L || R);
      const trim = escCor(cor, 0.78), topo = '#f6f3ec', rod = l.modelo === 'ubs' ? '#13a79a' : escCor(cor, 0.62);
      const lugVidro = () => { if (!vidrosPorLugar.has(ln)) vidrosPorLugar.set(ln, new Malha()); return vidrosPorLugar.get(ln); };
      if (ch === '+') {
        // porta: batentes, verga e folha aberta (nas paredes altas)
        const largo = horiz || !vert;
        const alto = h > 1;
        const ph = alto ? 2.15 : 0.5;
        if (largo) { M.caixa(i + 0.07, 0, cz, 0.14, ph, T, trim); M.caixa(i + 0.93, 0, cz, 0.14, ph, T, trim); if (alto) M.caixa(cx, 2.15, cz, 1, h - 2.15, T, cor); }
        else { M.caixa(cx, 0, j + 0.07, T, ph, 0.14, trim); M.caixa(cx, 0, j + 0.93, T, ph, 0.14, trim); if (alto) M.caixa(cx, 2.15, cz, T, h - 2.15, 1, cor); }
        if (alto && largo) M.caixa(i + 0.14, 0, cz - 0.28, 0.07, 2.1, 0.78, '#9a6a3a', -0.15);
        if (!alto) M.caixa(cx, 0.08, cz, 0.9, 0.012, 0.9, '#7c5a3a');

      // pilar + braços
      M.caixa(cx, 0, cz, T, h, T, cor);

      if (R) M.caixa(i + 0.75, 0, cz, 0.5, h, T, cor);
      if (U) M.caixa(cx, 0, j + 0.25, T, h, 0.5, cor);
      if (D) M.caixa(cx, 0, j + 0.75, T, h, 0.5, cor);
      // rodapé e acabamento no topo
      M.caixa(cx, 0, cz, T + 0.04, 0.16, T + 0.04, rod);
      if (L) M.caixa(i + 0.25, 0, cz, 0.5, 0.16, T + 0.04, rod);
      if (R) M.caixa(i + 0.75, 0, cz, 0.5, 0.16, T + 0.04, rod);
      if (U) M.caixa(cx, 0, j + 0.25, T + 0.04, 0.16, 0.5, rod);
      if (D) M.caixa(cx, 0, j + 0.75, T + 0.04, 0.16, 0.5, rod);
      M.caixa(cx, h, cz, T + 0.05, 0.05, T + 0.05, topo);
      if (L) M.caixa(i + 0.25, h, cz, 0.5, 0.05, T + 0.05, topo);
      if (R) M.caixa(i + 0.75, h, cz, 0.5, 0.05, T + 0.05, topo);
      if (U) M.caixa(cx, h, j + 0.25, T + 0.05, 0.05, 0.5, topo);
      if (D) M.caixa(cx, h, j + 0.75, T + 0.05, 0.05, 0.5, topo);

          else { M.caixa(cx, 1.0, cz, T + 0.08, 1.0, 0.72, '#e8e4da'); vg.caixa(cx, 1.04, cz, 0.05, 0.92, 0.62, '#bfe3f5'); }
        } else if (r < 0.2 && l.casa) {
          const cor2 = ['#c95f5f', '#5f8fc9', '#c9a95f', '#6fb08a'][Math.floor(r * 20) % 4];
          if (horiz) { const lado = terr(W, i, j + 1) === '_' ? 1 : -1; M.caixa(cx, 1.35, cz + lado * (T / 2 + 0.02), 0.6, 0.45, 0.04, '#6b4a2a'); M.caixa(cx, 1.4, cz + lado * (T / 2 + 0.045), 0.48, 0.35, 0.02, cor2); }
          else { const lado = terr(W, i + 1, j) === '_' ? 1 : -1; M.caixa(cx + lado * (T / 2 + 0.02), 1.35, cz, 0.04, 0.45, 0.6, '#6b4a2a'); M.caixa(cx + lado * (T / 2 + 0.045), 1.4, cz, 0.02, 0.35, 0.48, cor2); }

  /* ---------- móveis ---------- */
  function construirMoveis(W, cfg, rv) {
    const M = new Malha();
    const efeitos = { tvs: [], fogoes: [], chuveiros: [], fontes: [], moinhos: [], vidros: [] };
    const dinamicos = [];
    for (const o of W.objs) {
      const i = o.x, j = o.y, cx = i + 0.5, cz = j + 0.5;

          M.caixa(cx, y0, cz + 0.15, 0.92, 0.28, 1.3, '#8a5a3b');
          M.caixa(cx, y0 + 0.28, cz + 0.13, 0.84, 0.14, 1.22, '#f3f6fa');
          M.caixa(cx, y0 + 0.42, cz + 0.4, 0.86, 0.1, 0.78, cob);
          M.caixa(cx, y0 + 0.42, cz - 0.3, 0.55, 0.1, 0.24, '#ffffff');

          M.caixa(cx, y0 + 0.7, cz, 0.98, 0.06, 0.98, '#b08455');
          M.caixa(cx, y0 + 0.76, cz, 0.5, 0.012, 0.5, '#f1e9d9');

          M.cilindro(cx, y0 + 0.76, cz - 0.3, 0.05, 0.11, '#e8f0f7', 8);

  /* ---------- decoração: sebes, postes, flores, placas, prédios de fundo, igreja, celeiro, lago… ---------- */
  function construirDecoracao(W, cfg, rv) {
    const M = new Malha();
    const extras = { postes: [], moinhos: [], animais: [], lagos: [], texturasPlaca: [], aves: [] };
    const ocupa = new Set(W.objs.map((o) => o.y * W.w + o.x));
    const bloqDecor = new Set();
    for (const d of W.decoracao || []) for (let y = d.y; y < d.y + d.h; y++) for (let x = d.x; x < d.x + d.w; x++) bloqDecor.add(y * W.w + x);
    const pisavel = (x, y) => { const c = terr(W, x, y); return (c === ',' || c === 'c') && !ocupa.has(y * W.w + x) && !bloqDecor.has(y * W.w + x); };
    // sebe contínua na borda; cancelas onde a rua sai do mapa
    for (let j = 0; j < W.h; j++) for (let i = 0; i < W.w; i++) {
      const borda = i === 0 || j === 0 || i === W.w - 1 || j === W.h - 1;
      if (!borda) continue;
      const c = terr(W, i, j);
      if (c === '.') {
        const horizontal = i === 0 || i === W.w - 1;
        const cx = i + 0.5, cz = j + 0.5;
        M.caixa(cx, 0, cz, horizontal ? 0.1 : 0.9, 0.9, horizontal ? 0.9 : 0.1, '#f2f2f2');
        continue;
      }
      if (c === ',' || c === 'c') { if (!ocupa.has(j * W.w + i) && !bloqDecor.has(j * W.w + i)) M.caixa(i + 0.5, 0, j + 0.5, 1, 0.55 + ruido(i, j, 6) * 0.1, 1, mistura('#3f8a43', '#4aa04b', ruido(i, j, 7))); }
    }
    // arbustos e flores junto às fachadas
    for (const l of W.lugares) {
      for (let y = l.y - 1; y <= l.y + l.h; y++) for (let x = l.x - 1; x <= l.x + l.w; x++) {
        if (x >= l.x && x < l.x + l.w && y >= l.y && y < l.y + l.h) continue;
        if (!pisavel(x, y) || terr(W, x, y) !== ',') continue;
        if (l.porta && Math.abs(x - l.porta.fora.x) <= 1 && Math.abs(y - l.porta.fora.y) <= 1) continue;
        const r = ruido(x, y, 7);
        if (r > 0.62) { M.esfera(x + 0.35, 0.3, y + 0.4, 0.3, '#3f9a4a', 7, 5); M.esfera(x + 0.65, 0.28, y + 0.6, 0.26, '#58b256', 7, 5); }
        else if (r > 0.42) for (let n = 0; n < 5; n++) { const fx = x + 0.15 + ruido(x, y, n) * 0.7, fz = y + 0.15 + ruido(x, y, n + 9) * 0.7; M.cilindro(fx, 0.02, fz, 0.012, 0.22, '#3a7d3a', 4); M.esfera(fx, 0.27, fz, 0.06, ['#ff8fb1', '#ffd84d', '#ffffff', '#b99bff'][(x + y + n) % 4], 5, 4); }
      }
    }
    // flores soltas, postes de luz, caixas de correio e placas
    for (let j = 0; j < W.h; j++) for (let i = 0; i < W.w; i++) {
      const c = terr(W, i, j);
      if (c === ',' && pisavel(i, j) && ruido(i, j, 9) > 0.975) for (let n = 0; n < 4; n++) { const fx = i + 0.2 + ruido(i, j, n) * 0.6, fz = j + 0.2 + ruido(i, j, n + 5) * 0.6; M.cilindro(fx, 0.02, fz, 0.012, 0.2, '#3a7d3a', 4); M.esfera(fx, 0.25, fz, 0.055, ['#ff8fb1', '#ffd84d', '#ffffff'][(i + n) % 3], 5, 4); }
      if (c === 'c' && pisavel(i, j) && (i * 3 + j * 5) % 8 === 0 && [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => terr(W, i + a, j + b) === '.')) {
        const px = i + 0.5, pz = j + 0.5;
        M.cilindro(px, 0.07, pz, 0.045, 3.0, '#3b4350', 6); M.caixa(px + 0.15, 3.0, pz, 0.42, 0.06, 0.08, '#3b4350'); M.caixa(px + 0.32, 2.93, pz, 0.2, 0.08, 0.12, '#f3f3e8');
        extras.postes.push({ x: px + 0.32, y: 2.9, z: pz });
      }
    }
    for (const l of W.lugares) {
      if (!l.porta) continue;
      const dx = l.porta.fora.x - l.porta.x, dy = l.porta.fora.y - l.porta.y;
      const lado = dy !== 0 ? [2, 0] : [0, 2];
      const q = { x: l.porta.fora.x + lado[0], y: l.porta.fora.y + lado[1] };
      const y0 = terr(W, q.x, q.y) === 'c' ? 0.07 : 0;
      if (!pisavel(q.x, q.y)) continue;
      const px = q.x + 0.5, pz = q.y + 0.5;
      if (l.casa) { M.cilindro(px, y0, pz, 0.04, 0.9, '#7a5a3a', 5); M.caixa(px, y0 + 0.9, pz, 0.3, 0.2, 0.2, '#3b82c4'); }
      else {

        M.cilindro(px, y0, pz, 0.05, 1.7, '#6b7280', 6); M.caixa(px, y0 + 1.45, pz, 0.9, 0.7, 0.08, cor, dy !== 0 ? 0 : Math.PI / 2);
        extras.texturasPlaca.push({ x: px, y: y0 + 1.8, z: pz, modelo: l.modelo, rot: dy !== 0 ? 0 : Math.PI / 2 });
      }
    }
    // construções decorativas
    const grupo = new THREE.Group();
    for (const d of W.decoracao || []) {
      const x0 = d.x, z0 = d.y, w = d.w, h = d.h, cx = x0 + w / 2, cz = z0 + h / 2;
      switch (d.t) {
        case 'predio': { // fundo de cidade: prédio com janelas
          M.caixa(cx, 0, cz, w - 0.3, d.alt, h - 0.3, d.cor);
          M.caixa(cx, d.alt, cz, w - 0.5, 0.4, h - 0.5, escCor(d.cor, 0.8));
          M.caixa(cx + w * 0.2, d.alt + 0.4, cz, 1.0, 0.8, 1.0, '#7d8794');
          for (let andar = 1; andar < d.alt - 0.5; andar += 1.5) for (let k = 0.7; k < w - 0.7; k += 1.1) {
            const acesa = ruido(x0 + k * 10, andar * 10, 3) > 0.7;
            const cj = acesa ? '#ffe9a8' : '#6d8fb0';
            M.caixa(x0 + k + 0.15, andar, z0 + h - 0.12, 0.7, 0.9, 0.06, cj); M.caixa(x0 + w - 0.12, andar, z0 + 0.7 + (k % 1.5), 0.06, 0.9, 0.6, cj);
          }
          break;
        }
        case 'hospital': { // UPA / hospital de referência: construção de fundo, sem atendimento no jogo
          const alt = d.alt || 3.4;
          M.caixa(cx, 0, cz, w - 0.3, alt, h - 0.3, '#f4f6f8');
          M.caixa(cx, alt, cz, w - 0.5, 0.3, h - 0.5, '#d5dbe1');

  /** Poses: ângulos-alvo das juntas (o desenho suaviza a transição). */

  /* ---------- luz e céu conforme a hora ---------- */

  /* ---------- câmera ---------- */

  /* ---------- quadro ---------- */

  const ponteiros = new Map();

    ctx.font = `${grande ? 16 : 13}px ${FONTE_EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
    ctx.fillText(texto, x, y - h / 2 + 1);
  }

  function plumbob(x, y, agora) {
    const f = Math.cos(agora / 450), yy = y + Math.sin(agora / 380) * 2.5;
    poli(ctx, [[x, yy - 12], [x + 6 * f, yy], [x, yy + 8], [x - 6 * f, yy]], '#34e07a', '#16a34a');
    poli(ctx, [[x, yy - 12], [x + 6 * f, yy], [x, yy - 2]], 'rgba(255,255,255,.4)');
  }

  /** Decide pose, posição visual e direção a partir da ação que a pessoa realmente está executando. */
  function poseDe(W, a) {
    let pose = a.path.length ? 'andar' : 'parado';
    let alvoX = a.x, alvoY = a.y, dirFixa = null, cadeira = null, ordem = 0, sentado = false;
    const virar = (ox, oy) => { dirFixa = dirDe(ox - a.x, oy - a.y); };
    if (a.k === 'res' && a.espera && !a.path.length && !a.atend) {
      const h = a.cadeira;
      if (h) { pose = 'sentar'; alvoX = h.x; alvoY = h.y; dirFixa = 1; ordem = 0.35; }
    } else if (a.acao && !a.path.length && ACOES_INFO[a.acao.k]) {
      const info = ACOES_INFO[a.acao.k], o = a.acao.obj;
      pose = info.pose;
      if (info.onde === 'objeto' && o) {
        alvoX = o.x; alvoY = o.y; ordem = 0.45;
        if (pose === 'deitar') { dirFixa = 0; ordem = 0.4; const outros = W.agentes.filter((x) => x !== a && x.vis && x.acao && x.acao.obj === o && x.id < a.id).length; if (outros) { alvoX += 0.28; alvoY += 0.38; ordem = 0.41; } }
        else if (a.acao.k === 'tv') { const v = (W.porTipo.V || []).find((x) => x.casa === o.casa); dirFixa = v ? dirDe(v.x - o.x, v.y - o.y) : 2; alvoY = o.y + 0.05; }
        else dirFixa = 1;
      } else if (info.onde === 'frente' && o) {
        virar(o.x, o.y);
        if (info.cadeira) { cadeira = { x: a.x, y: a.y }; sentado = true; }
      }
    }
    if (a.k === 'staff' && !a.path.length && a.tarefa && a.tarefa.fase === 'atendendo') pose = 'digitar';
    return { pose, alvoX, alvoY, dirFixa, cadeira, ordem, sentado };
  }

  /* ---------- Iluminação ---------- */
  function desenhaNoite(S, W, cfg) {
    const h = minutoDoDia(S) / 60;
    let alfa = 0;
    if (h >= 20 || h < 5) alfa = 0.58;
    else if (h >= 18.2) alfa = ((h - 18.2) / 1.8) * 0.58;
    else if (h < 7) alfa = ((7 - h) / 2) * 0.58;
    if (alfa < 0.02) return;
    nctx.setTransform(1, 0, 0, 1, 0, 0);
    nctx.globalCompositeOperation = 'source-over';
    nctx.clearRect(0, 0, noite.width, noite.height);
    nctx.fillStyle = `rgba(12,20,70,${alfa})`;
    nctx.fillRect(0, 0, noite.width, noite.height);
    nctx.setTransform(dpr * cam.z, 0, 0, dpr * cam.z, (largura / 2 - cam.x * cam.z) * dpr, (altura / 2 - cam.y * cam.z) * dpr);
    nctx.globalCompositeOperation = 'destination-out';
    const abertaUBS = ubsAberta(W, S, cfg);
    for (const l of W.lugares) {
      const acordados = W.agentes.some((a) => a.vis && a.x >= l.x && a.x < l.x + l.w && a.y >= l.y && a.y < l.y + l.h && !(a.acao && a.acao.k === 'dormir'));
      if (!(acordados || (l.modelo === 'ubs' && abertaUBS))) continue;
      const [cx, cy] = proj(l.x + l.w / 2, l.y + l.h / 2, 20);
      const r = (l.w + l.h) * HW * 0.5;
      const g = nctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r);
      g.addColorStop(0, 'rgba(0,0,0,.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      nctx.fillStyle = g; nctx.beginPath(); nctx.arc(cx, cy, r, 0, 7); nctx.fill();
    }
    nctx.globalCompositeOperation = 'source-over';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(noite, 0, 0);
  }

  function desenhaRotulos(S, W, cfg) {
    if (cam.z < 0.4) return;
    ctx.font = '700 11px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const l of W.lugares) {
      let nome = null;
      if (l.casa) nome = S.familias.find((f) => f.id === l.casa).nome.replace('Família ', '').replace('Casal ', '');
      else if (l.modelo === 'ubs') nome = `✚ ${cfg.territorio.nomeUnidade}`;
      else if (l.modelo === 'escola') nome = 'Escola';
      else if (l.modelo === 'trabalho') nome = cfg.cenario.id === 'metropole' ? 'Escritórios' : 'Comércio';
      else if (l.modelo === 'lanche') nome = 'Lanchonete';
      if (!nome) continue;
      const [cx, cy] = proj(l.x + l.w / 2, l.y + l.h / 2, 100);
      const larg = ctx.measureText(nome).width + 14;
      rr(ctx, cx - larg / 2, cy - 9, larg, 18, 9, l.modelo === 'ubs' ? '#0f766e' : 'rgba(255,255,255,.9)');
      ctx.fillStyle = l.modelo === 'ubs' ? '#fff' : '#1f2937';
      ctx.fillText(nome, cx, cy + 0.5);
    }
  }

  /* ---------- Cenário: decoração, céu e base (maquete) ---------- */
  const terrEm = (W, x, y) => (x >= 0 && y >= 0 && x < W.w && y < W.h ? W.terr[y * W.w + x] : null);

  function preparaDecor(W) {
    const rv = preparaMapa(W);
    if (rv.decor) return rv;
    const decor = [], pavers = new Set();
    const ocupados = new Set(W.objs.map((o) => o.y * W.w + o.x));
    const livre = (x, y) => terrEm(W, x, y) === ',' && !ocupados.has(y * W.w + x);
    const pisavel = (x, y) => { const c = terrEm(W, x, y); return (c === ',' || c === 'c') && !ocupados.has(y * W.w + x); };
    for (const l of W.lugares) {
      if (l.porta) {
        const dx = l.porta.fora.x - l.porta.x, dy = l.porta.fora.y - l.porta.y;
        let x = l.porta.fora.x, y = l.porta.fora.y;
        for (let n = 0; n < 8; n++) {
          const ch = terrEm(W, x, y);
          if (ch === null || ch === '.' || ch === 'c') break;
          if (ch === ',') pavers.add(y * W.w + x);
          x += dx; y += dy;
        }
        const lado = dy !== 0 ? [2, 0] : [0, 2];
        const q = { x: l.porta.fora.x + lado[0], y: l.porta.fora.y + lado[1] };
        if (pisavel(q.x, q.y)) decor.push({ t: l.casa ? 'correio' : 'placa', modelo: l.modelo, x: q.x, y: q.y });
      }
      for (let y = l.y - 1; y <= l.y + l.h; y++) for (let x = l.x - 1; x <= l.x + l.w; x++) {
        if (x >= l.x && x < l.x + l.w && y >= l.y && y < l.y + l.h) continue;
        if (!livre(x, y)) continue;
        if (l.porta && Math.abs(x - l.porta.fora.x) <= 1 && Math.abs(y - l.porta.fora.y) <= 1) continue;
        if (pavers.has(y * W.w + x)) continue;
        if (ruido(x, y, 7) > 0.42) decor.push({ t: ruido(x, y, 8) > 0.6 ? 'arbusto' : 'flores', x, y });
      }
    }
    for (let y = 0; y < W.h; y++) for (let x = 0; x < W.w; x++) {
      const k = y * W.w + x, c = W.terr[k];
      if (c === 'c' && !ocupados.has(k) && [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => terrEm(W, x + a, y + b) === '.') && (x * 3 + y * 5) % 8 === 0) decor.push({ t: 'poste', x, y });
      else if (c === ',' && livre(x, y) && ruido(x, y, 9) > 0.965 && !pavers.has(k)) decor.push({ t: 'flores', x, y });
      if ((x === 0 || y === 0 || x === W.w - 1 || y === W.h - 1) && pisavel(x, y)) decor.push({ t: 'sebe', x, y });
    }
    rv.decor = decor; rv.pavers = pavers;
    return rv;
  }

  function desenhaDecor(d, noite, agora) {
    const [bx, by] = proj(d.x + 0.5, d.y + 0.5);
    switch (d.t) {
      case 'arbusto':
        elipse(ctx, bx + 4, by + 3, 14, 5, 'rgba(0,0,0,.16)');
        elipse(ctx, bx - 5, by - 5, 9, 8, '#3f8f42'); elipse(ctx, bx + 6, by - 5, 9, 8, '#4aa04b'); elipse(ctx, bx, by - 11, 9, 8, '#58b256');
        elipse(ctx, bx - 3, by - 13, 3, 2.4, 'rgba(255,255,255,.25)');
        break;
      case 'flores': {
        for (let n = 0; n < 5; n++) {
          const fx = bx + (ruido(d.x, d.y, n) - 0.5) * 30, fy = by + (ruido(d.x, d.y, n + 9) - 0.5) * 12;
          ctx.strokeStyle = '#3a7d3a'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - 6); ctx.stroke();
          ctx.fillStyle = ['#ff8fb1', '#ffd84d', '#ffffff', '#b99bff'][(d.x + d.y + n) % 4]; ctx.beginPath(); ctx.arc(fx, fy - 7, 2.6, 0, 7); ctx.fill();
        }
        break;
      }
      case 'sebe': caixa(ctx, d.x + 0.05, d.y + 0.05, d.x + 0.95, d.y + 0.95, 0, 11, '#3f8a43', { topo: '#58b256', borda: 'rgba(0,0,0,.12)' }); break;
      case 'poste': {
        caixa(ctx, d.x + 0.45, d.y + 0.45, d.x + 0.55, d.y + 0.55, 0, 54, '#4b5563', { borda: null });
        const [lx, ly] = proj(d.x + 0.5, d.y + 0.5, 56);
        elipse(ctx, lx, ly, 5, 3, noite ? '#fff3b0' : '#e5e7eb');
        if (noite) { const g = ctx.createRadialGradient(lx, ly + 20, 2, lx, ly + 20, 46); g.addColorStop(0, 'rgba(255,230,150,.38)'); g.addColorStop(1, 'rgba(255,230,150,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(lx, ly + 20, 46, 0, 7); ctx.fill(); }
        break;
      }
      case 'correio': {
        caixa(ctx, d.x + 0.45, d.y + 0.45, d.x + 0.55, d.y + 0.55, 0, 18, '#7a5a3a', { borda: null });
        caixa(ctx, d.x + 0.3, d.y + 0.3, d.x + 0.7, d.y + 0.7, 18, 28, '#3b82c4');
        break;
      }
      case 'placa': {
        caixa(ctx, d.x + 0.44, d.y + 0.44, d.x + 0.56, d.y + 0.56, 0, 40, '#6b7280', { borda: null });
        const cor = { ubs: '#16a34a', escola: '#e3a70b', lanche: '#e4572e', trabalho: '#3b6fb6' }[d.modelo] || '#16a34a';
        const [sx, sy] = proj(d.x + 0.5, d.y + 0.5, 50);
        rr(ctx, sx - 17, sy - 13, 34, 26, 6, cor);
        ctx.font = `15px ${FONTE_EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
        ctx.fillText({ ubs: '✚', escola: '📚', lanche: '🍔', trabalho: '💼' }[d.modelo] || '✚', sx, sy + 1);
        break;
      }
      default: break;
    }
  }

  function desenhaCeu(agora) {
    const g = ctx.createLinearGradient(0, 0, 0, altura);
    g.addColorStop(0, '#8fcbee'); g.addColorStop(0.6, '#d8eefa'); g.addColorStop(1, '#eef8ee');
    ctx.fillStyle = g; ctx.fillRect(0, 0, largura, altura);
    // sol suave e nuvens com paralaxe
    const sol = ctx.createRadialGradient(largura * 0.85, altura * 0.12, 4, largura * 0.85, altura * 0.12, 120);
    sol.addColorStop(0, 'rgba(255,245,200,.9)'); sol.addColorStop(1, 'rgba(255,245,200,0)');
    ctx.fillStyle = sol; ctx.fillRect(0, 0, largura, altura);
    for (let n = 0; n < 6; n++) {
      const base = n * 190 + 40, x = ((base + agora * 0.006 * (0.6 + n * 0.1) - cam.x * 0.08) % (largura + 300)) - 150;
      const y = 40 + ((n * 83) % 150) - cam.y * 0.04;
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.beginPath(); ctx.ellipse(x, y, 50, 14, 0, 0, 7); ctx.ellipse(x - 28, y + 4, 30, 11, 0, 0, 7); ctx.ellipse(x + 30, y + 5, 34, 11, 0, 0, 7); ctx.fill();
    }
  }

  function desenhaBase(W) {
    const e = 40;
    const A = proj(0, W.h), B = proj(W.w, W.h), C = proj(W.w, 0);
    ctx.save();
    ctx.shadowColor = 'rgba(30,45,60,.35)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 36;
    poli(ctx, [A, B, [B[0], B[1] + e], [A[0], A[1] + e]], '#8e5d3d');
    ctx.restore();
    poli(ctx, [A, B, [B[0], B[1] + e], [A[0], A[1] + e]], '#9a6743');
    poli(ctx, [C, B, [B[0], B[1] + e], [C[0], C[1] + e]], '#6f4730');
    // camadas de terra
    ctx.strokeStyle = 'rgba(40,22,10,.25)'; ctx.lineWidth = 2;
    for (const f of [0.35, 0.7]) {
      ctx.beginPath(); ctx.moveTo(A[0], A[1] + e * f); ctx.lineTo(B[0], B[1] + e * f); ctx.lineTo(C[0], C[1] + e * f); ctx.stroke();
    }
    // faixa de grama na borda
    poli(ctx, [A, B, [B[0], B[1] + 7], [A[0], A[1] + 7]], '#5aa24c');
    poli(ctx, [C, B, [B[0], B[1] + 7], [C[0], C[1] + 7]], '#437f3a');
  }

  /* ---------- Cache: o terreno estático vira uma imagem; a árvore, um sprite ---------- */
  function construirCache(S, W, cfg) {
    const rv = preparaDecor(W);
    if (rv.cache) return rv.cache;
    const pad = 140, minX = -W.h * HW - pad, minY = -pad, larg = (W.w + W.h) * HW + pad * 2, alt = (W.w + W.h) * HH + pad * 2 + 60;
    const escala = Math.min(1.4, Math.sqrt(9e6 / (larg * alt)));
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(larg * escala); cv.height = Math.ceil(alt * escala);
    const c2 = cv.getContext('2d');
    const anterior = ctx;
    ctx = c2;
    ctx.setTransform(escala, 0, 0, escala, -minX * escala, -minY * escala);
    desenhaBase(W);
    desenhaChao(S, W, cfg, 0, W.w - 1, 0, W.h - 1);
    const fixos = rv.decor.filter((d) => d.t === 'sebe' || d.t === 'flores' || d.t === 'arbusto').sort((a, b) => (a.x + a.y) - (b.x + b.y));
    for (const d of fixos) desenhaDecor(d, false, 0);
    ctx = anterior;
    rv.cache = { cv, minX, minY, escala };
    return rv.cache;
  }

  let spriteArvore = null;
  function arvoreSprite() {
    if (spriteArvore) return spriteArvore;
    const cv = document.createElement('canvas'); cv.width = 120; cv.height = 140;
    const c2 = cv.getContext('2d');
    const anterior = ctx; ctx = c2;
    ctx.translate(60, 112);
    elipse(ctx, 6, 2, 20, 8, 'rgba(0,0,0,.18)');
    caixa(ctx, -0.08, -0.1, 0.08, 0.06, 0, 24, '#7a5230', { borda: null });
    const cores = ['#2f7d32', '#3e9142', '#55a84d'];
    [[0, -30, 22], [-9, -42, 17], [9, -42, 17], [0, -54, 15]].forEach(([dx, dy, r], n) => elipse(ctx, dx, dy, r, r * 0.9, cores[n % 3]));
    elipse(ctx, -5, -56, 7, 5, 'rgba(255,255,255,.18)');
    ctx = anterior;
    spriteArvore = cv;
    return cv;
  }

  /* ---------- Quadro ---------- */
  function desenha(agora) {
    const { S, W, cfg } = E();
    if (!S || !W) return;
    if (canvas.clientWidth !== largura || canvas.clientHeight !== altura) redimensiona();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    desenhaCeu(agora);
    ctx.save();
    ctx.translate(largura / 2, altura / 2); ctx.scale(cam.z, cam.z); ctx.translate(-cam.x, -cam.y);
    { const ch = construirCache(S, W, cfg); ctx.drawImage(ch.cv, ch.minX, ch.minY, ch.cv.width / ch.escala, ch.cv.height / ch.escala); }

    const xa = cam.x - largura / cam.z / 2 - 80, xb = cam.x + largura / cam.z / 2 + 80;
    const ya = cam.y - altura / cam.z / 2 - 140, yb = cam.y + altura / cam.z / 2 + 60;
    let i0 = 1e9, i1 = -1e9, j0 = 1e9, j1 = -1e9;
    for (const [sx, sy] of [[xa, ya], [xb, ya], [xa, yb], [xb, yb]]) {
      const ti = (sy / HH + sx / HW) / 2, tj = (sy / HH - sx / HW) / 2;
      i0 = Math.min(i0, ti); i1 = Math.max(i1, ti); j0 = Math.min(j0, tj); j1 = Math.max(j1, tj);
    }
    i0 = Math.max(0, Math.floor(i0) - 1); i1 = Math.min(W.w - 1, Math.ceil(i1) + 1); j0 = Math.max(0, Math.floor(j0) - 1); j1 = Math.min(W.h - 1, Math.ceil(j1) + 1);

    const els = [];
    const horaNoite = (() => { const h = minutoDoDia(S) / 60; return h >= 18.5 || h < 6; })();
    for (const d of preparaDecor(W).decor) { if (d.t === 'sebe' || d.t === 'flores' || d.t === 'arbusto') continue; if (d.x < i0 - 1 || d.x > i1 + 1 || d.y < j0 - 1 || d.y > j1 + 1) continue; els.push({ k: d.x + d.y + (d.t === 'sebe' ? 1 : 0.7), f: () => desenhaDecor(d, horaNoite, agora) }); }
    const vivos = new Set();
    for (const a of W.agentes) {
      if (!a.vis) continue;
      vivos.add(a.id);
      let st = rs.get(a.id);
      if (!st) { st = { px: a.x, py: a.y, fase: (hashR(a.id) % 600) / 100, dir: 1, ox: a.x, oy: a.y, estilo: estiloAgente(a, S) }; rs.set(a.id, st); }
      const dx = a.x - st.ox, dy = a.y - st.oy, dist = Math.hypot(dx, dy);
      if (dist > 1e-4) { st.fase += dist * 4.6; st.dir = dirDe(dx, dy); }
      st.ox = a.x; st.oy = a.y;
      const pz = poseDe(W, a);
      const k = pz.pose === 'andar' ? 1 : 0.18;
      st.px += (pz.alvoX - st.px) * k; st.py += (pz.alvoY - st.py) * k;
      if (Math.abs(st.px - pz.alvoX) < 0.01) st.px = pz.alvoX;
      if (Math.abs(st.py - pz.alvoY) < 0.01) st.py = pz.alvoY;
      const dirUsar = pz.dirFixa !== null ? pz.dirFixa : st.dir;
      st.pz = pz;
      const [sx, sy] = proj(st.px + 0.5, st.py + 0.5);
      st.sx = sx; st.sy = sy;
      if (a.k === 'res') st.estilo.humor = S.mundo.needs[a.pid].humor;
      els.push({ k: st.px + st.py + 1 + (pz.ordem || 0) + 0.02, f: () => {
        if (pz.cadeira) { const [cx, cy] = proj(pz.cadeira.x + 0.5, pz.cadeira.y + 0.5); desenhaCadeira(cx, cy + 3, dirUsar === 1 || dirUsar === 3); }
        const yy = sy + (pz.pose === 'sentar' ? -4 : pz.sentado || pz.pose === 'digitar' ? 2 : 6);
        desenhaPessoa(st.estilo, { dir: dirUsar, fase: st.fase, pose: pz.pose, t: agora, sentado: pz.sentado }, sx, yy);
        if (pz.pose === 'fumar') for (let n = 0; n < 3; n++) { const f = ((agora / 1500) + n / 3) % 1; ctx.fillStyle = `rgba(220,220,220,${0.55 * (1 - f)})`; ctx.beginPath(); ctx.arc(sx + 6 + Math.sin(f * 7 + n) * 3, yy - 38 - f * 22, 2 + f * 3, 0, 7); ctx.fill(); }
        if (pz.pose === 'deitar') for (let n = 0; n < 3; n++) { const f = ((agora / 2200) + n / 3) % 1; ctx.fillStyle = `rgba(80,120,200,${1 - f})`; ctx.font = `bold ${9 + n * 2}px system-ui`; ctx.textAlign = 'center'; ctx.fillText('z', sx + 12 + f * 14, yy - 30 - f * 26); }
      } });
      if (pz.pose === 'banho' && a.acao && a.acao.obj) {
        const o = a.acao.obj;
        els.push({ k: o.x + o.y + 1.6, f: () => {
          poli(ctx, [proj(o.x + 1, o.y, 0), proj(o.x + 1, o.y + 1, 0), proj(o.x + 1, o.y + 1, 44), proj(o.x + 1, o.y, 44)], 'rgba(190,225,245,.35)', 'rgba(255,255,255,.7)');
          poli(ctx, [proj(o.x, o.y + 1, 0), proj(o.x + 1, o.y + 1, 0), proj(o.x + 1, o.y + 1, 44), proj(o.x, o.y + 1, 44)], 'rgba(190,225,245,.35)', 'rgba(255,255,255,.7)');
        } });
      }
    }
    for (const id of [...rs.keys()]) if (!vivos.has(id)) rs.delete(id);

    const emTrat = CONDS.some((id) => p.cond[id].diag && p.cond[id].trat);
    const sint = sintomasDe(S, cfg, p.id);
    el.innerHTML = `<div class="c-topo"><span class="emoji">${emojiPessoa(p)}</span>
        <div class="c-id"><b>${esc(p.nome)}</b> <small>${p.idade} anos</small><div class="c-acao" id="c-acao"></div></div>
        ${ag.fila.length ? `<button class="chip-fila" data-act="cartao-cancelar" aria-label="Cancelar ordens">✕ ${ag.fila.length} na fila</button>` : ''}</div>
      ${sint.length ? `<div class="alerta-sint">🤒 Você está sentindo: ${esc(sint.join(', '))}</div>` : ''}
      <div class="necs">${Object.keys(ROTULO_NEC).map((k) => barraNec(k)).join('')}</div>
      <div class="c-btns um"><button class="btn primario" data-act="abrir-acoes">🎬 Fazer algo…</button></div>
      <div class="c-btns">
        <button class="btn peq" data-act="cartao-unidade">🏥 Unidade</button>
        ${emTrat ? '<button class="btn peq" data-act="cartao-remedio">💊 Remédio</button>' : ''}
        ${p.tabagismo ? '<button class="btn peq" data-act="cartao-fumar">🚬 Fumar</button>' : ''}
        <button class="btn peq ${S.jogador.vontade ? 'ligado' : ''}" data-act="cartao-vontade">🧠 Vontade ${S.jogador.vontade ? 'ligada' : 'desl.'}</button>
      </div>`;
  } else {
    const at = atendimentoAtual(W, S);
    el.innerHTML = `<div class="c-topo"><span class="emoji">${EMOJI_PAPEL[papel()]}</span>
        <div class="c-id"><b>${esc(cfg.papeis[papel()].nome)}</b><div class="c-acao" id="c-acao"></div></div>
        ${ag.fila.length ? `<button class="chip-fila" data-act="cartao-cancelar">✕ ${ag.fila.length} na fila</button>` : ''}</div>
      ${(() => { const af = afazeresDoDia(W, S, cfg); const pend = papel() === 'enfermeiro' ? pedidosPendentes(W).length : 0; return af.aberto ? `<div class="alerta-sint af">📋 Afazeres do dia: <b>${af.feitos}/${af.total}</b>${pend ? ` · 📥 <b>${pend} pedido(s)</b> da equipe` : ''}</div>` : ''; })()}
      <div class="c-btns um"><button class="btn primario" data-act="abrir-acoes">🎬 Ações…</button></div>
      <div class="c-btns" style="grid-template-columns:repeat(2,1fr)">
        ${papel() === 'acs' ? '<button class="btn peq" data-act="abrir-territorio">🏘️ Minhas famílias</button><button class="btn peq" data-act="cartao-mutirao">🧹 Mutirão</button>'
    : `<button class="btn peq" data-act="abrir-fila">📋 Fila de espera</button><button class="btn peq" data-act="abrir-atend" ${at ? '' : 'disabled'}>🩺 Atendimento atual</button>`}
      </div>`;
  }
}

function atualizaPainel() {
  if (aba !== 'mundo' || $('#cartao').hidden) return;
  const ag = meuAgente();
  const acao = $('#c-acao');
  if (acao) acao.textContent = acaoAtual(W, S, ag);
  if (modo() === 'paciente') {
    const n = S.mundo.needs[ag.pid];
    for (const k of Object.keys(ROTULO_NEC)) {
      const b = $(`#n-${k}`);
      if (b) { b.style.width = `${n[k]}%`; b.className = n[k] < 25 ? 'ruim' : n[k] < 50 ? 'medio' : ''; }
    }
  }
}

function dicaDoMomento() {
  if (modo() === 'paciente') {
    const p = minhaPessoa();
    if (!jaDeuOrdem) return (R && R.modo === '2d' && window.__sem3d ? '<b>Modo simples (2D):</b> sem câmera giratória. Toque em <b>⟳</b> para ligar o 3D. ' : '') + 'Toque em <b>🎬 Fazer algo…</b> para escolher o que ele faz (dormir, ler, caminhar…).';
    const sint = sintomasDe(S, cfg, p.id);
    if (sint.length && !p.conhecido.medidas) return `Você está sentindo <b>${esc(sint[0])}</b>. Pode ser algo sério: pense em procurar a unidade (toque nos móveis dela).`;
    if (p.idade >= 18 && p.conhecido.medidasTurno === null && S.turno >= 0 && S.mundo.min > 3 * 1440) return 'Você nunca mediu pressão e glicemia. Muita doença é <b>silenciosa</b>: considere pedir uma <b>triagem</b> na unidade.';
    if (CONDS.some((id) => p.cond[id].diag && p.cond[id].trat) && !S.mundo.remedios[p.id].hoje && S.mundo.min % 1440 > 6 * 60 && S.mundo.min % 1440 < 12 * 60) return 'Hora do <b>remédio</b>: toque na cozinha e escolha "Tomar o remédio".';
    return null;
  }
  if (!jaDeuOrdem) {
    if (papel() === 'acs') return 'Toque numa <b>pessoa</b> para aferir pressão, orientar ou convidar à unidade, e numa <b>casa</b> para visitar a família.';
    return 'Toque numa <b>pessoa sentada na fila</b> (⏳) para chamar para atendimento. Seu painel mostra a fila.';
  }
  if (clinico() && resumoEquipe(W)[papel() === 'tecnico' ? 'triagem' : papel() === 'enfermeiro' ? 'enfermagem' : 'consulta'] > 0 && !atendimentoAtual(W, S) && meuAgente().fila.length === 0) return 'Há gente na sua fila. Toque numa pessoa com ⏳ e escolha <b>Chamar para atendimento</b>.';
  if (clinico() || papel() === 'acs') {
    const ag = meuAgente(), af = afazeresDoDia(W, S, cfg);
    if (af.aberto && af.feitos < af.total && !ag.tarefa && !ag.afz && !ag.fila.length && !ag.path.length) return `Sem ninguém para atender agora. Escolha um <b>afazer do dia</b> em 🎬 Ações (${af.feitos}/${af.total} feitos).`;
  }
  return null;
}
function atualizaDica() {
  const el = $('#dica');
  const txt = aba === 'mundo' && !folha && !menu && !painelOculto ? dicaDoMomento() : null;
  if (!txt) { el.hidden = true; return; }
  if (el.dataset.t !== txt) { el.innerHTML = txt; el.dataset.t = txt; }
  el.hidden = false;
}

/* ---------- Telas de lista ---------- */
function barraIndicador(rotulo, valor, detalhe = '') {
  const v = valor === null ? 0 : valor * 100;
  return `<div style="margin-bottom:12px"><div class="rotulo"><span>${rotulo}</span><span>${pct(valor)}${detalhe}</span></div>
    <div class="barra ${valor !== null && valor < 0.3 ? 'perigo' : valor !== null && valor < 0.6 ? 'alerta' : ''}"><i style="width:${v}%"></i></div></div>`;
}
function linhaHabito(rotulo, v, inverso = false) {
  const bom = inverso ? 100 - v : v;
  return `<div class="hab"><div class="rotulo"><span>${rotulo}</span><span>${Math.round(v)}</span></div><div class="barra ${bom < 35 ? 'perigo' : bom < 60 ? 'alerta' : ''}"><i style="width:${bom}%"></i></div></div>`;
}

function viewSaude() {
  const p = minhaPessoa(), c = p.conhecido;
  const sint = sintomasDe(S, cfg, p.id);
  const diag = CONDS.filter((id) => p.cond[id].diag);
  const r = S.mundo.remedios[p.id];
  const retorno = CONDS.some((id) => p.cond[id].diag && p.cond[id].trat) && S.turno - (p.retornoTurno === undefined ? -99 : p.retornoTurno) >= 1;
  let medidas = '<p class="dica-t">Você ainda não mediu a pressão nem a glicemia. Muita doença não dá sintoma.</p>';
  if (c.medidas) { const q = S.turno - c.medidasTurno; medidas = `<div class="kv"><span>Pressão arterial</span><span>${c.medidas.pas}/${c.medidas.pad} mmHg</span><span>Glicemia</span><span>${c.medidas.glic} mg/dL</span><span>Medido</span><span>${q === 0 ? 'neste mês' : `há ${q} mês(es)`}</span></div>`; }
  const h = p.habitos;
  return `<h2 class="secao">Como me sinto</h2>
    <div class="card">${sint.length ? `<p>🤒 ${esc(sint.join(', '))}</p><p class="dica-t">Sintomas merecem atenção. A unidade atende em dia útil.</p>` : '<p>😊 Sem queixas no momento.</p><p class="dica-t">Atenção: algumas doenças, como a pressão alta, não dão sintoma.</p>'}</div>
    ${retorno ? '<div class="card"><strong>🗓️ Retorno pendente</strong><p class="dica-t">Já faz um mês da última consulta: o médico pediu para voltar.</p></div>' : ''}
    <h2 class="secao">Meu acompanhamento</h2>
    <div class="card">${diag.length ? diag.map((id) => `<div class="rotulo"><strong>${cfg.cond[id].icone} ${esc(cfg.cond[id].nome)}</strong><span>${p.cond[id].trat ? 'em tratamento' : 'sem tratamento'}</span></div>`).join('') + (diag.some((id) => p.cond[id].trat) ? `<p class="dica-t" style="margin-top:8px">💊 Remédio tomado neste mês: <b>${r.dias}</b> dia(s) ${r.hoje ? '· já tomou hoje' : '· ainda não tomou hoje'}. A adesão do mês decide se a doença fica controlada.</p>` : '') : '<p class="dica-t">Nenhum diagnóstico até agora.</p>'}
      ${p.conhecido.suspeitas.length ? `<p class="dica-t">⚠ Valores alterados na última medida: ${p.conhecido.suspeitas.map((id) => esc(cfg.cond[id].nome)).join(', ')}. Vale uma consulta.</p>` : ''}</div>
    <div class="card" style="margin-top:10px">${medidas}</div>
    <h2 class="secao">💰 Dinheiro da família</h2>
    ${(() => { const f = achaFamilia(S, p.familiaId); const dep = dependencia(p); return `<div class="card"><div class="kv"><span>Classe</span><span>${esc(cfg.game.familia.classes[f.classe].rotulo)}</span><span>Renda mensal</span><span>R$ ${f.renda}</span><span>Saldo</span><span>R$ ${f.saldo}${f.aperto ? ' ⚠' : ''}</span></div>
      <p class="dica-t">Remédio: a farmácia da UBS é gratuita enquanto houver estoque; faltando, compra-se na Farmácia Popular (privada conveniada), pagando uma parte. ${f.aperto ? '<b>Aperto financeiro: fica mais difícil seguir o tratamento.</b>' : ''}</p>
      ${p.semRemedio && p.semRemedio.length ? `<p class="dica-t">⚠️ Sem remédio neste mês: ${p.semRemedio.map((id) => esc(cfg.cond[id].nome)).join(', ')}. Compre na farmácia (🎬 Fazer algo → Saúde).</p>` : ''}
      <p class="dica-t">🤲 Cuidador: ${p.cuidador ? `${esc(p.cuidador.nome)} (${p.cuidador.tipo}), qualidade do cuidado ${Math.round(p.cuidador.qualidade)}%.` : dep ? `não tem. Motivo que pode justificar: ${esc(dep)}. Você pode pedir em 🎬 Fazer algo → Saúde (o jogo aceita ou recusa).` : 'não precisa agora.'}</p></div>`; })()}
    <h2 class="secao">Meu estilo de vida</h2>
    <div class="card">${p.idade >= 12 ? `${linhaHabito('Atividade física', h.atividade)}${linhaHabito('Alimentação', h.alimentacao)}${linhaHabito('Sono', h.sono)}${linhaHabito('Estresse (menos é melhor)', h.estresse, true)}` : '<p class="dica-t">Cuide da rotina: sono, comida e brincadeira.</p>'}
      <div class="kv" style="margin-top:8px"><span>Fuma</span><span>${p.tabagismo ? 'Sim' : 'Não'}</span>${p.idade >= 18 ? `<span>IMC</span><span>${p.imc}</span>` : ''}</div>
      <p class="dica-t">Os hábitos mudam devagar, conforme o que você faz no dia a dia (comer bem, dormir, se mexer).</p></div>`;
}

function viewDiario() {
  let itens = S.diario;
  if (modo() === 'paciente') { const p = minhaPessoa(); itens = itens.filter((e) => e.pessoaId === p.id || e.familiaId === p.familiaId || e.tipo === 'aprendizado'); }
  if (!itens.length) return '<p class="vazio">Nada por aqui ainda.</p>';
  const lis = [...itens].reverse().slice(0, 150).map((e) => `<div class="entrada ${e.tipo}"><div class="quando">${MESES_ABR[e.mes]}/${e.ano}</div>${esc(e.texto)}</div>`).join('');
  return `<h2 class="secao">${modo() === 'paciente' ? 'Meu diário' : 'Diário da unidade'}</h2>${lis}`;
}

function viewUnidade() {
  const mundo = cfg.cenario.mundo, inf = S.infestacao, r = resumoEquipe(W);
  const aberta = ubsAberta(W, S, cfg), med = ubsAberta(W, S, cfg, true);
  const dias = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex'];
  const diasMedico = mundo.medicoDias.filter((d) => d < 5).map((d) => dias[d]).join(', ');
  const fila = (tipo, nome) => {
    const l = filaEspera(W, tipo);
    return `<div class="card"><div class="rotulo"><strong>${nome}</strong><span>${l.length} aguardando</span></div>${l.length ? l.map((o) => `<div class="kv" style="font-size:13px"><span>${esc(achaPessoa(S, o.pid).nome)}</span><span>${Math.round((S.mundo.min - o.t0))} min</span></div>`).join('') : '<p class="dica-t">Ninguém na fila.</p>'}</div>`;
  };
  return `<h2 class="secao">Funcionamento</h2>
    <div class="card"><div class="rotulo"><strong>${aberta ? '🟢 Aberta agora' : '🔴 Fechada agora'}</strong><span>${mundo.expediente[0]}h–${mundo.expediente[1]}h, dias úteis</span></div>
      <p class="dica-t">Médico(a): ${diasMedico} ${med ? '· presente hoje' : '· <b>não atende hoje</b>'}.<br>Pessoas chamadas: ${r.chamados} · tarefas de campo: ${r.acs}.</p></div>
    <h2 class="secao">Filas</h2>${fila('triagem', '📏 Aferição (técnico)')}${fila('acolhimento', '🤝 Acolhimento (enfermeira)')}${fila('enfermagem', '🩺 Consulta de enfermagem')}${fila('consulta', '🩺 Consulta médica')}
    <h2 class="secao">🤝 Vínculo entre os profissionais</h2>
    <div class="card">${vinculosEquipe(S, cfg).map((x) => barraIndicador(`${EMOJI_PAPEL[x.a]} ${esc(cfg.papeis[x.a].curto || cfg.papeis[x.a].nome)} ↔ ${EMOJI_PAPEL[x.b]} ${esc(cfg.papeis[x.b].curto || cfg.papeis[x.b].nome)}`, x.v / 100)).join('')}
      <p class="dica-t">Equipe afinada atende mais rápido e perde menos encaminhamentos; equipe desencontrada atrasa e se perde (até 30% mais lento). O vínculo esfria sem convivência: converse, discuta casos, faça reuniões e pausas na copa.</p></div>
    <h2 class="secao">🏥 UPA / hospital de referência</h2>
    <div class="card"><p class="dica-t">Não há atendimento no mapa: é a referência para o que extrapola a atenção primária (média e alta complexidade). A equipe encaminha pela regulação da enfermeira e, na alta, a pessoa volta para <b>orientação e acompanhamento pós-cirurgia/procedimento</b> na unidade.</p>
      <div class="kv"><span>Internados agora</span><span>${todasPessoas(S).filter((q) => q.internado).length}</span><span>Pós-alta aguardando acompanhamento</span><span>${todasPessoas(S).filter((q) => q.posAlta && !q.posAlta.orientado).length}</span><span>Pessoas acamadas</span><span>${todasPessoas(S).filter((q) => q.acamado).length}</span><span>Pedidos pendentes à coordenação</span><span>${pedidosPendentes(W).length}</span></div></div>
    <h2 class="secao">Vigilância do território</h2>
    <div class="card"><div class="rotulo"><strong>🦟 Índice de infestação do mosquito</strong><span>${inf}%</span></div>
      <div class="barra ${inf >= 60 ? 'perigo' : inf >= 35 ? 'alerta' : ''}"><i style="width:${inf}%"></i></div>
      <p class="dica-t">De novembro a abril, com calor e chuva, a infestação tende a subir. O agente comunitário organiza os mutirões.</p></div>`;
}

function viewDesempenho() {
  const i = indicadores(S, cfg), c = cfg.cenario, m = S.metricas;
  const espera = m.atendidos + m.triagens ? Math.round(m.esperaTotal / Math.max(1, m.atendidos + m.triagens + m.orientacoes)) : 0;
  return `<h2 class="secao">Cenário</h2>
    <div class="card"><div class="rotulo"><strong>${c.icone} ${esc(c.nome)}</strong></div><ul class="lista">${c.desafios.map((d) => `<li>${esc(d)}</li>`).join('')}</ul></div>
    <h2 class="secao">Seu trabalho</h2>
    <div class="card"><div class="kv"><span>Consultas feitas</span><span>${m.atendidos}</span><span>Triagens</span><span>${m.triagens}</span><span>Orientações</span><span>${m.orientacoes}</span><span>Visitas domiciliares</span><span>${m.visitas}</span><span>Afazeres concluídos</span><span>${m.afazeres || 0}</span><span>Reuniões de equipe</span><span>${m.reunioes || 0}</span><span>Falhas de comunicação</span><span>${m.falhasComunicacao || 0}</span><span>Espera média</span><span>${espera} min</span></div></div>
    <h2 class="secao">📘 Competências praticadas (PNAB)</h2>
    <div class="card">${(() => { const l = competenciasDe(S, papel()); const feitas = l.filter((c) => c.vezes > 0).length; const m = S.metricas; return `<div class="rotulo"><strong>${feitas}/${l.length} competências do seu papel</strong><span></span></div><div class="barra"><i style="width:${Math.round(100 * feitas / l.length)}%"></i></div>${l.map((c) => `<div class="kv" style="font-size:13px;margin-top:6px"><span>${c.vezes ? '✅' : '⬜'} ${esc(c.rot)}</span><span>${c.vezes}×</span></div>`).join('')}${papel() === 'enfermeiro' && (m.acolhCertos || m.acolhErrados) ? `<p class="dica-t" style="margin-top:8px">Classificação de risco: ${m.acolhCertos || 0} adequada(s) · ${m.acolhErrados || 0} a melhorar.</p>` : ''}${papel() === 'tecnico' && (m.alertasSinalizados || m.alertasPerdidos) ? `<p class="dica-t" style="margin-top:8px">Sinais de alerta: ${m.alertasSinalizados || 0} comunicado(s) · ${m.alertasPerdidos || 0} não sinalizado(s).</p>` : ''}<p class="dica-t">Cada competência explica a regra da PNAB na primeira vez que você a pratica (veja o Diário).</p>`; })()}</div>
    <h2 class="secao">Desempenho da unidade</h2>
    <div class="card"><div class="rotulo"><span>Liga</span><span>pontuação ${Math.round(i.score * 100)}</span></div><div class="liga">🏅 ${i.liga}</div></div>
    <div class="card" style="margin-top:10px">
      ${(() => { const dx = todasPessoas(S).filter((q) => CONDS.some((id) => q.cond[id].diag)); const est = dx.filter((q) => q.estratoTurno !== undefined && S.turno - q.estratoTurno < 12).length; const acomp = dx.filter((q) => q.medTurno !== undefined && S.turno - q.medTurno < 12).length; return `${barraIndicador('Diagnosticados com estratificação de risco atualizada (12 meses)', dx.length ? est / dx.length : null, ` (${est}/${dx.length})`)}${barraIndicador('Diagnosticados com consulta médica nos últimos 12 meses', dx.length ? acomp / dx.length : null, ` (${acomp}/${dx.length})`)}<p class="dica-t">Indicadores sugeridos nas Diretrizes de HAS/DM da SESA-ES (cobertura, estratificação atualizada, metas e internações).</p>`; })()}
    </div>
    <div class="card" style="margin-top:10px">
      ${barraIndicador('Adultos com PA/glicemia medidas (12 meses)', i.rastreamento)}
      ${barraIndicador('Hipertensos diagnosticados e controlados', i.has, ` (${i.hasTotal})`)}
      ${barraIndicador('Diabéticos diagnosticados e controlados', i.dm, ` (${i.dmTotal})`)}
      ${barraIndicador('Depressão diagnosticada e em tratamento', i.dep, ` (${i.depTotal})`)}
      ${barraIndicador('Vínculo médio com as famílias', i.vinculoMedio)}
      <div class="rotulo"><span>Internações nos últimos 12 meses</span><span>${i.internacoesAno}</span></div></div>
    <button class="btn" style="margin-top:14px" data-act="sobre"><span>ℹ️ Sobre o jogo e avisos</span></button>`;
}

function renderVista() {
  const v = $('#vista');
  if (aba === 'mundo') return;
  const scroll = v.scrollTop;
  const corpo = { saude: viewSaude, diario: viewDiario, unidade: viewUnidade, desempenho: viewDesempenho, feedback: viewFeedback }[aba]();
  v.innerHTML = corpo + (modo() === 'paciente' && aba === 'diario' ? '' : '') + (aba === 'saude' ? '<button class="btn" style="margin-top:14px" data-act="sobre"><span>ℹ️ Sobre o jogo e avisos</span></button>' : '');
  v.scrollTop = scroll;
}

/* ---------- Feedback ---------- */
function infoFeedback() {
  let instalado = false;
  try { instalado = !!(window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)); } catch { /* ok */ }
  return contextoTecnico({
    userAgent: navigator.userAgent, graficos: R && R.modo === '3d' ? '3D' : '2D', cenario: cfg && cfg.cenario.id,
    personagem: S && S.jogador ? (modo() === 'paciente' ? 'paciente' : papel()) : '-', mesesJogados: S && S.metricas ? S.mes : undefined,
    instalado, tela: `${window.innerWidth}x${window.innerHeight}`, testador: window.__testador && window.__testador.id,
  });
}

function viewFeedback() {
  if (fbEstado === 'enviado') {
    return `<div class="card"><h2>Obrigado! 💚</h2><p>${esc(fbMsg)}</p><p class="dica-t">Sua opinião ajuda a decidir os próximos passos do jogo.</p></div>
      <button class="btn" style="margin-top:12px" data-act="fb-novo"><span>Enviar outro feedback</span></button>`;
  }
  const blocos = PERGUNTAS.map((p) => {
    const v = fbResp[p.id];
    if (p.tipo === 'estrelas') return `<div class="card fb"><b>${esc(p.rot)}</b><div class="fb-op">${[1, 2, 3, 4, 5].map((n) => `<button data-act="fb-op" data-id="${p.id}" data-v="${n}" aria-pressed="${v === n}">${n <= (v || 0) ? '⭐' : '☆'}</button>`).join('')}</div></div>`;
    if (p.tipo === 'opcoes') return `<div class="card fb"><b>${esc(p.rot)}</b><div class="fb-op">${p.opcoes.map((o) => `<button class="pill" data-act="fb-op" data-id="${p.id}" data-v="${esc(o)}" aria-pressed="${v === o}">${esc(o)}</button>`).join('')}</div></div>`;
    return `<div class="card fb"><label for="fb-${p.id}"><b>${esc(p.rot)}</b></label><${p.curto ? 'input type="text"' : 'textarea rows="3"'} id="fb-${p.id}" data-fb="${p.id}" maxlength="600" ${p.curto ? `value="${esc(v || '')}"` : ''}>${p.curto ? '' : esc(v || '')}${p.curto ? '' : '</textarea>'}${p.curto ? '' : ''}</div>`;
  }).join('');
  const ctx = infoFeedback();
  return `<h2 class="secao">Sua opinião</h2>
    <p class="dica-t">Leva 2 minutos. Responda o que quiser — nada é obrigatório.</p>${blocos}
    <div class="card fb"><b>Informações enviadas junto</b><p class="dica-t">Versão ${esc(ctx.versao)} · gráficos ${esc(ctx.graficos)} · cenário ${esc(ctx.cenario)} · tela ${esc(ctx.tela)}. Nenhum dado de saúde seu é enviado.</p></div>
    <button class="btn primario" style="margin-top:12px" data-act="fb-enviar" ${fbEstado === 'enviando' ? 'disabled' : ''}><span>${fbEstado === 'enviando' ? 'Enviando…' : '📨 Enviar feedback'}</span></button>
    ${fbMsg ? `<p class="aviso" style="margin-top:10px">${esc(fbMsg)}</p>` : ''}`;
}

async function enviaFeedbackAgora() {
  if (!temResposta(fbResp)) { fbMsg = 'Responda ao menos uma pergunta antes de enviar.'; renderVista(); return; }
  fbEstado = 'enviando'; fbMsg = ''; renderVista();
  const r = await enviarFeedback(fbResp, infoFeedback(), base.game.feedback);
  if (r.ok) {
    fbEstado = 'enviado';
    fbMsg = { forms: 'Seu feedback foi enviado.', compartilhar: 'Feedback compartilhado.', copia: 'O texto foi copiado. Cole numa conversa e envie para quem te passou o jogo.' }[r.via] || 'Feedback enviado.';
    fbResp = {}; salvaRascunhoFb();
  } else {
    fbEstado = 'editando';
    fbMsg = r.via === 'cancelado' ? '' : 'Não foi possível enviar agora. Tente de novo com internet.';
  }
  if (aba === 'feedback') renderVista();
}

/* ---------- Folhas (modais) ---------- */
const ROTULO_ESTADO = { aguardando: '⏳ aguardando a enfermeira', aprovado: '✅ aprovado: toque para iniciar', negado: '✖ negado pela enfermeira', precisa: '📤 pede aprovação da enfermeira', andamento: 'em andamento', feito: 'feito' };
function blocoAfazeres() {
  const af = afazeresDoDia(W, S, cfg);
  if (!af.aberto) return '<p class="dica-t">Fora do expediente: os afazeres do dia aparecem quando a unidade abre.</p>';
  const ocupado = !!meuAgente().tarefa;
  return `<h2 class="secao">📋 Afazeres do dia (${af.feitos}/${af.total})</h2>${af.lista.map((i) => `<button class="btn" data-act="afazer" data-id="${i.uid}" ${i.feito || ocupado || i.estado === 'aguardando' || i.estado === 'negado' ? 'disabled' : ''}><span>${i.estado === 'feito' ? '✅' : i.ic} ${esc(i.rot)}</span>${ROTULO_ESTADO[i.estado] ? `<small>${ROTULO_ESTADO[i.estado]}</small>` : i.campo ? '<small>em campo</small>' : ''}</button>`).join('')}`;
}

/** A enfermeira é a coordenadora: aprova ou nega o que sai para o território e as referências. */
function blocoPedidos() {
  if (papel() !== 'enfermeiro') return '';
  const l = pedidosPendentes(W);
  return `<h2 class="secao">📥 Pedidos da equipe (${l.length})</h2>${W.cobrancaEstoque ? '<p class="dica-t">📣 Você já cobrou o relatório de estoque do técnico.</p>' : `<button class="btn peq" data-act="pedido-op" data-op="cobrar_estoque" data-id="x">📣 Cobrar do técnico o relatório de estoque${S.mundo.estoqueRel ? ` (último: dia ${S.mundo.estoqueRel.dia + 1}, ${S.mundo.estoqueRel.valor} insumos)` : ' (nenhum ainda)'}</button>`}${l.length ? l.map((q) => `<div class="card eq"><div class="rotulo"><strong>${EMOJI_PAPEL[q.papel]} ${esc(cfg.papeis[q.papel].nome)}</strong><span>há ${Math.round(S.mundo.min - q.t0)} min</span></div><div class="dica-t">${esc(q.rot)}</div>
    <div class="c-btns" style="grid-template-columns:repeat(2,1fr);margin-top:6px"><button class="btn peq primario" data-act="pedido-op" data-op="pedido_sim" data-id="${q.id}">✅ Aprovar</button><button class="btn peq" data-act="pedido-op" data-op="pedido_nao" data-id="${q.id}">✖ Negar</button></div></div>`).join('') : '<p class="dica-t">Nenhum pedido pendente. O agendamento de visitas domiciliares (médico e técnico) e os mutirões passam por você; a referência à UPA/hospital é feita direto pelo médico ou por você.</p>'}`;
}

/** Interações com os outros profissionais: ninguém faz nada sozinho. */
function blocoEquipe() {
  const eu = meuAgente();
  const colegas = W.agentes.filter((a) => a.k === 'staff' && a.id !== eu.id && a.vis);
  const reuniao = opcoesPara(W, S, cfg, colegas.length ? { tipo: 'agente', id: colegas[0].id } : { tipo: 'agente', id: eu.id }).find((o) => o.id === 'equipe_reuniao');
  const lista = colegas.map((b) => {
    const ops = opcoesPara(W, S, cfg, { tipo: 'agente', id: b.id }).filter((o) => o.id === 'colega_conversar' || o.id === 'colega_caso');
    const par = vinculosEquipe(S, cfg).find((x) => (x.a === eu.papel && x.b === b.papel) || (x.b === eu.papel && x.a === b.papel));
    const v = par ? par.v : 100;
    return `<div class="card eq"><div class="rotulo"><strong>${EMOJI_PAPEL[b.papel]} ${esc(cfg.papeis[b.papel].nome)}</strong><span>vínculo ${b.papel === eu.papel ? '—' : v + '%'}</span></div>
      <div class="dica-t">${esc(acaoAtual(W, S, b))}</div>
      <div class="c-btns" style="grid-template-columns:repeat(2,1fr);margin-top:6px">${ops.map((o) => `<button class="btn peq" data-act="equipe-op" data-op="${o.id}" data-id="${b.id}" ${o.desab ? 'disabled' : ''}>${o.ic} ${o.id === 'colega_caso' ? 'Discutir caso' : 'Conversar'}</button>`).join('')}</div>
      ${ops.some((o) => o.desab) ? `<div class="dica-t">${esc(ops.find((o) => o.desab).desab)}</div>` : ''}</div>`;
  }).join('');
  return `<h2 class="secao">🤝 Equipe (ninguém faz nada sozinho)</h2>
    <button class="btn" data-act="equipe-op" data-op="equipe_reuniao" data-id="${eu.id}" ${reuniao && reuniao.desab ? 'disabled' : ''}><span>👥 Convocar reunião de equipe</span>${reuniao && reuniao.desab ? `<small>${esc(reuniao.desab)}</small>` : ''}</button>
    ${lista || '<p class="dica-t">Nenhum colega na unidade agora.</p>'}`;
}

function folhaAcoes() {
  let corpo = '';
  if (modo() === 'paciente') {
    corpo = acoesPaciente(W, S, cfg).map((g) => `<h2 class="secao">${esc(g.nome)}</h2>${g.itens.map((i) => `<button class="btn" data-act="acao-op" data-op="${i.id}" ${i.desab ? 'disabled' : ''}><span>${i.ic} ${esc(i.rot)}</span>${i.desab ? `<small>${esc(i.desab)}</small>` : ''}</button>`).join('')}`).join('');
  } else if (papel() === 'acs') {
    corpo = `${blocoAfazeres()}${blocoPedidos()}${blocoEquipe()}<h2 class="secao">Visitas e orientações</h2><button class="btn" data-act="abrir-territorio"><span>🏘️ Visitar uma família</span></button>

    corpo = `${blocoAfazeres()}${blocoPedidos()}${blocoEquipe()}<h2 class="secao">Atendimento</h2><button class="btn primario" data-act="prof-chamar-prox"><span>📣 Chamar o próximo da fila</span></button>

}

function folhaPessoas() {
  const a = meuAgente();
  const lista = W.agentes.filter((x) => x.k === 'res' && x.vis).map((x) => ({ x, d: Math.hypot(x.x - a.x, x.y - a.y) })).sort((p, q) => p.d - q.d);
  const itens = lista.map(({ x, d }) => { const p = achaPessoa(S, x.pid); return `<button class="pessoa" data-act="pessoa-menu" data-id="${x.id}"><span class="emoji">${emojiPessoa(p)}</span><span class="info"><div class="nome">${esc(p.nome)}</div><div class="sub">${p.idade} anos · ${esc(acaoAtual(W, S, x))} · ${Math.round(d)} passos</div></span><span aria-hidden="true">›</span></button>`; }).join('');

}

function folhaCenarios() {

function folhaPersonagem() {
  const troca0 = !!(folha && folha.troca);
  const atualK = S.jogador ? chaveDe(S.jogador) : null;
  const estadoVida = (k) => (!troca0 ? { t: 'novo' } : k === atualK ? { t: 'atual', dias: diasDeVida(S) } : arquivo.itens[k] ? { t: 'arq', dias: diasDeVida(arquivo.itens[k]) } : { t: 'novo' });
  const selo = (e) => (e.t === 'atual' ? `<div class="vida atual">● Em jogo agora · dia ${e.dias}</div>` : e.t === 'arq' ? `<div class="vida arq">📁 Vida arquivada · dia ${e.dias} (continua de onde parou)</div>` : (troca0 ? '<div class="vida">✨ Vida nova</div>' : ''));
  const botaoReiniciar = (k, e) => (troca0 && e.t !== 'novo' ? `<button class="btn peq" style="margin-top:6px" data-act="pers-reiniciar" data-id="${k}">${confirmaReinicio === k ? '⚠️ Toque de novo para apagar e recomeçar' : '🔄 Recomeçar esta vida do zero'}</button>` : '');
  const rotuloBotao = (e, nome, papelTxt) => (e.t === 'atual' ? 'Continuar com este personagem' : e.t === 'arq' ? `Continuar a vida de ${nome}` : papelTxt);
  const pac = todasPessoas(S).map((p) => { const k = `p:${p.id}`, e = estadoVida(k); return `
    <div class="card pers"><div class="c-topo"><span class="emoji">${emojiPessoa(p)}</span>
      <div class="c-id"><b>${esc(p.nome)}</b> <small>${p.idade} anos</small><div class="tags">${dicasDe(p).map((d) => `<span class="selo">${esc(d)}</span>`).join('')}</div></div></div>
      ${selo(e)}<button class="btn primario" style="margin-top:8px" data-act="pers-paciente" data-id="${p.id}"><span>${esc(rotuloBotao(e, p.nome.split(' ').pop(), `Viver a história de ${p.nome.split(' ').pop()}`))}</span></button>${botaoReiniciar(k, e)}</div>`; }).join('');
  const mundo = cfg.cenario.mundo;
  const dias = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex'];
  const prof = PAPEIS.map((id) => {
    const r = cfg.papeis[id], k = `f:${id}`, e = estadoVida(k);
    const extra = id === 'medico' && mundo.medicoDias.length < 5 ? `<li>Neste cenário você atende só ${mundo.medicoDias.map((d) => dias[d]).join(' e ')}</li>` : '';
    return `<div class="card pers"><div class="c-topo"><span class="emoji">${r.icone}</span><div class="c-id"><b>${esc(r.nome)}</b></div></div>
      <p class="dica-t" style="margin:6px 0">${esc(r.resumo)}</p><p class="dica-t"><b>Competências (PNAB):</b></p><ul class="lista">${(r.competencias || []).map((d) => `<li>${esc(d)}</li>`).join('')}</ul><p class="dica-t"><b>Desafios:</b></p><ul class="lista">${r.desafios.map((d) => `<li>${esc(d)}</li>`).join('')}${extra}</ul>
      ${selo(e)}<button class="btn primario" style="margin-top:8px" data-act="pers-prof" data-id="${id}"><span>${esc(rotuloBotao(e, r.nome.toLowerCase(), `Trabalhar como ${r.nome.toLowerCase()}`))}</span></button>${botaoReiniciar(k, e)}</div>`;
  }).join('');
  const troca = !!(folha && folha.troca);
  return `<div class="folha-topo"><h2>${troca ? 'Trocar de personagem' : 'Quem você será?'}</h2>${troca ? '<button class="fechar" data-act="fechar" aria-label="Fechar">✕</button>' : ''}</div>
    <p class="dica-t" style="margin:0 0 8px">${troca ? '<b>Cada personagem é uma vida independente</b>, com o seu próprio mundo, diário e progresso. Ao trocar, a vida atual fica arquivada e só continua se você voltar a ela. ' : ''}Você joga com <b>um único personagem</b> e vive o que ele viver. As doenças de cada pessoa são <b>surpresa</b>.</p>
    <div class="abas-pers"><button class="${abaPers === 'paciente' ? 'on' : ''}" data-act="pers-aba" data-id="paciente">🧑 Paciente</button><button class="${abaPers === 'profissional' ? 'on' : ''}" data-act="pers-aba" data-id="profissional">🩺 Profissional</button></div>
    ${abaPers === 'paciente' ? pac : prof}

    <button class="btn" ${troca ? 'style="margin-top:12px"' : ''} data-act="trocar-cenario"><span>‹ Trocar de cenário ${troca ? '(começa uma nova história)' : ''}</span></button>`;

function folhaMenu() {
  const lis = menu.ops.length ? menu.ops.map((o) => `<button class="btn" data-act="menu-op" data-op="${o.id}" ${o.desab ? 'disabled' : ''}><span>${o.ic} ${esc(o.rot)}</span>${o.desab ? `<small>${esc(o.desab)}</small>` : ''}</button>`).join('') : '<p class="vazio">Nada para fazer aqui.</p>';
  return `<div class="folha-topo"><h2>${esc(menu.titulo)}</h2><button class="fechar" data-act="menu-fechar" aria-label="Fechar">✕</button></div>${lis}`;
}

function conhecidoDe(p) {
  const c = p.conhecido;
  let medidas = '<p class="dica-t">Sem medidas ainda.</p>';
  if (c.medidas) { const q = S.turno - c.medidasTurno; medidas = `<div class="kv"><span>Pressão arterial</span><span>${c.medidas.pas}/${c.medidas.pad} mmHg</span><span>Glicemia</span><span>${c.medidas.glic} mg/dL</span><span>Medido</span><span>${q === 0 ? 'neste mês' : `há ${q} mês(es)`}</span></div>`; }
  let hab = '<p class="dica-t">Hábitos ainda não conhecidos.</p>';
  if (c.habitos) { const h = c.habitos; hab = `${linhaHabito('Atividade física', h.atividade)}${linhaHabito('Alimentação', h.alimentacao)}${linhaHabito('Sono', h.sono)}${linhaHabito('Estresse (menos é melhor)', h.estresse, true)}<div class="kv" style="margin-top:6px"><span>Fuma</span><span>${h.tabagismo ? 'Sim' : 'Não'}</span></div>`; }
  return `<div class="tags" style="margin:0 0 8px">${tagsPessoa(p)}${c.risco.map((r) => `<span class="selo warn">${cfg.cond[r].icone} risco: ${esc(cfg.cond[r].nome)}</span>`).join('')}</div>
    <div class="card">${medidas}</div><div class="card" style="margin-top:8px">${hab}</div>`;
}

function folhaAtendimento() {
  const at = atendimentoAtual(W, S);
  if (!at) return '<div class="folha-topo"><h2>Atendimento</h2><button class="fechar" data-act="fechar">✕</button></div><p class="vazio">Nenhum atendimento em andamento.</p>';
  const p = achaPessoa(S, at.pid);
  const nomeServ = { triagem: 'Aferição (técnico de enfermagem)', acolhimento: 'Acolhimento e classificação de risco', enfermagem: 'Consulta de enfermagem', consulta: 'Consulta médica' }[at.tipo];
  let corpo = '';
  if (at.fase === 'chamando') corpo = '<p class="vazio">⏳ Aguardando a pessoa chegar…</p>';
  if (at.fase === 'atendendo') corpo = '<p class="vazio">🩺 Atendendo… (o tempo continua correndo)</p>';
  if (at.fase === 'pronto') {
    if (at.tipo === 'triagem') corpo = '<button class="btn primario" data-act="atender"><span>📏 Aferir PA, glicemia e peso</span><small>10 min</small></button><p class="dica-t">📘 PNAB: o técnico realiza o procedimento e registra; a classificação de risco é da enfermeira.</p>';
    else if (at.tipo === 'acolhimento') corpo = '<button class="btn primario" data-act="atender"><span>🤝 Acolher e classificar o risco</span><small>6 min</small></button><p class="dica-t">📘 PNAB: o acolhimento com escuta qualificada e a classificação de risco da demanda espontânea são da enfermeira.</p>';
    else if (at.tipo === 'enfermagem') corpo = `<p class="dica-t">Escolha o foco da orientação (ou deixe automático):</p><button class="btn primario" data-act="atender"><span>🩺 Consulta de enfermagem (foco automático)</span><small>18 min</small></button>${Object.entries(FOCOS).filter(([k]) => k !== 'fumo' || p.tabagismo).map(([k, nome]) => `<button class="btn" data-act="atender" data-foco="${k}"><span>Foco: ${esc(nome)}</span></button>`).join('')}`;
    else corpo = '<button class="btn primario" data-act="atender"><span>🩺 Consulta médica</span><small>30 min</small></button>';
  }
  if (at.fase === 'resultado') {
    corpo = `<div class="card"><strong>Resultado</strong><p style="margin-top:4px">${esc(at.resultado || '')}</p></div>`;
    if (at.tipo === 'consulta') {
      corpo += CONDS.filter((id) => p.cond[id].diag).map((id) => `<button class="btn ${p.cond[id].trat ? '' : 'primario'}" data-act="tratar" data-id="${p.id}" data-cond="${id}" data-ligar="${p.cond[id].trat ? 0 : 1}"><span>${cfg.cond[id].icone} ${esc(cfg.cond[id].nome)}: ${p.cond[id].trat ? 'suspender tratamento' : 'iniciar tratamento'}</span><small>💊 UBS grátis (c/ estoque) · Farm. Popular R$ ${copagamento(cfg, id)}/mês · família ${esc(CLASSE_ROT[achaFamilia(S, p.familiaId).classe])}</small></button>`).join('');
      const ref = criterioReferencia(S, p);
      if (ref) corpo += `<div class="alerta-sint">🚑 Extrapola a atenção primária: ${esc(ref)}.</div><button class="btn" data-act="concluir" data-destino="referencia"><span>🚑 Encaminhar à UPA/hospital</span><small>direto (competência médica/enfermagem)</small></button>`;
      corpo += '<button class="btn primario" style="margin-top:8px" data-act="concluir" data-destino="liberar"><span>✔ Concluir atendimento</span></button>';
    } else {
      if (at.tipo === 'triagem') { // técnico: não classifica risco nem decide o destino
        const alerta = /SINAL DE ALERTA/.test(at.resultado || '');
        corpo += `<p class="dica-t">📘 PNAB: a classificação de risco é atribuição da enfermeira. Registre e entregue a pessoa ao acolhimento${alerta ? ' — e comunique o sinal de alerta com prioridade.' : '.'}</p>
          ${alerta ? '<div class="alerta-sint">⚠️ Há sinal de alerta nas medidas: comunique a enfermeira na hora.</div>' : ''}
          <button class="btn ${alerta ? 'primario' : ''}" data-act="concluir" data-destino="acolhimento_urgente"><span>🚨 Entregar à enfermeira com prioridade</span></button>
          <button class="btn ${alerta ? '' : 'primario'}" data-act="concluir" data-destino="acolhimento"><span>🤝 Registrar e encaminhar ao acolhimento</span></button>`;
      } else {
        corpo += `<p class="dica-t">${at.tipo === 'acolhimento' ? '📘 Classifique o risco e decida o destino:' : 'Para onde encaminhar?'}</p>`;
        corpo += '<button class="btn" data-act="concluir" data-destino="enfermagem"><span>🩺 Consulta de enfermagem (protocolos)</span></button><button class="btn" data-act="concluir" data-destino="consulta"><span>🩺 Consulta médica</span></button>';
        corpo += `<button class="btn" data-act="concluir" data-destino="referencia"><span>🚑 Encaminhar à UPA/hospital</span><small>só se extrapolar a atenção primária</small></button>`;
        corpo += '<button class="btn primario" data-act="concluir" data-destino="liberar"><span>✔ Liberar com orientações</span></button>';
      }
    }
  }
  return `<div class="folha-topo"><h2>${nomeServ}</h2><button class="fechar" data-act="fechar" aria-label="Fechar">✕</button></div>
    <div class="c-topo" style="margin-bottom:8px"><span class="emoji">${emojiPessoa(p)}</span><div class="c-id"><b>${esc(p.nome)}</b> <small>${p.idade} anos</small></div></div>
    ${corpo}<h2 class="secao">O que se sabe</h2>${conhecidoDe(p)}`;
}

function folhaFila() {
  const l = filaEspera(W, servicosDe(papel()));
  const itens = l.length ? l.map((o) => { const p = achaPessoa(S, o.pid); return `<div class="pessoa"><span class="emoji">${emojiPessoa(p)}</span><span class="info"><div class="nome">${esc(p.nome)}</div><div class="sub">${p.idade} anos · aguarda há ${Math.round(S.mundo.min - o.t0)} min</div></span><button class="btn peq" style="width:auto" data-act="chamar" data-id="${p.id}">Chamar</button></div>`; }).join('') : '<p class="vazio">Ninguém na sua fila.</p>';
  return `<div class="folha-topo"><h2>📋 Fila de espera</h2><button class="fechar" data-act="fechar">✕</button></div>${itens}`;
}

function folhaTerritorio() {
  const itens = S.familias.map((f) => {
    const r = f.pessoas.some((p) => p.conhecido.suspeitas.length || CONDS.some((id) => p.cond[id].diag && !p.cond[id].trat)) ? '<span class="selo warn">⚠ atenção</span>' : '';
    return `<div class="pessoa"><span class="emoji">🏠</span><span class="info"><div class="nome">${esc(f.nome)}</div><div class="sub">vínculo ${Math.round(f.vinculo)}% · ${f.visTurno === S.turno ? 'visitada neste mês' : 'sem visita neste mês'}</div><div class="sub">💰 ${esc(cfg.game.familia.classes[f.classe].rotulo)} · renda R$ ${f.renda}/mês · saldo R$ ${f.saldo}${f.aperto ? ' · ⚠ aperto financeiro' : ''}</div>${f.pessoas.filter((q) => q.acamado).map((q) => `<div class="sub">🛏️ ${esc(q.nome)} acamado(a) · cuidador: ${q.cuidador ? `${esc(q.cuidador.nome)} (${q.cuidador.tipo}, qualidade ${Math.round(q.cuidador.qualidade)}%, sobrecarga ${Math.round(q.cuidador.sobrecarga)}%)` : '<b>nenhum</b>'} · lesão ${Math.round(q.acamado.lesao * 10) / 10}</div>`).join('')}<div class="tags">${r}</div></span><button class="btn peq" style="width:auto" data-act="visitar" data-id="${f.id}" ${f.visTurno === S.turno ? 'disabled' : ''}>Visitar</button></div>`;
  }).join('');
  return `<div class="folha-topo"><h2>🏘️ Minhas famílias</h2><button class="fechar" data-act="fechar">✕</button></div>${itens}
    <p class="dica-t">Tocar numa pessoa no mapa permite aferir a pressão, orientar e convidar para a unidade.</p>`;
}

function folhaRelatorio() {
  let itens = W.relatorio || [];
  let extra = '';
  if (modo() === 'paciente') {
    const p = minhaPessoa();
    itens = itens.filter((e) => e.pessoaId === p.id || e.tipo === 'aprendizado');
    const mes = S.diario.filter((e) => e.mes === ((S.mes + 11) % 12) && (e.pessoaId === p.id || e.familiaId === p.familiaId));
    const h = p.habitos;
    extra = `<div class="card"><strong>Seu estilo de vida agora</strong>${p.idade >= 12 ? `${linhaHabito('Atividade física', h.atividade)}${linhaHabito('Alimentação', h.alimentacao)}${linhaHabito('Sono', h.sono)}${linhaHabito('Estresse (menos é melhor)', h.estresse, true)}` : ''}</div>`;
    itens = [...mes.map((e) => ({ tipo: e.tipo, texto: e.texto })), ...itens];
  } else {
    const i = indicadores(S, cfg);
    extra = `<div class="card"><div class="rotulo"><span>Liga da unidade</span><span>🏅 ${i.liga}</span></div></div>`;
  }
  const lis = itens.length ? itens.map((e) => `<div class="entrada ${e.tipo}">${esc(e.texto)}</div>`).join('') : '<p class="vazio">Mês tranquilo: nada de especial aconteceu.</p>';
  return `<div class="folha-topo"><h2>📋 ${modo() === 'paciente' ? 'Seu mês' : 'Relatório do mês'}</h2><button class="fechar" data-act="fechar" aria-label="Fechar">✕</button></div>
    <p class="dica-t" style="margin:0 0 10px">Começou ${esc(rotuloData(S))}. O jogo está em pausa até você continuar.</p>${extra}${lis}
    <button class="btn primario" style="margin-top:14px" data-act="fechar"><span>Continuar</span></button>`;
}

function folhaIntro() {
  const paciente = modo() === 'paciente';
  const passos = paciente ? `
    <div class="p"><span class="passo">1</span><div><b>Você é ${esc(minhaPessoa().nome)}</b><br>Veja as necessidades (fome, energia, humor…) no painel. Seus hábitos de verdade decidem sua saúde.</div></div>
    <div class="p"><span class="passo">2</span><div><b>Dê ordens</b><br>Toque numa cama, sofá, fogão, chuveiro ou no chão. Com a <i>vontade própria</i> ligada, ele segue a rotina quando você não manda nada.</div></div>
    <div class="p"><span class="passo">3</span><div><b>Cuide da saúde</b><br>Sentiu algo? Procure a unidade (tocando nos móveis dela). Se houver tratamento, tome o remédio todo dia.</div></div>
    <div class="p"><span class="passo">4</span><div><b>Surpresas</b><br>Doenças podem aparecer sem sintoma. Medir a pressão e a glicemia ajuda a descobrir cedo.</div></div>`
    : `
    <div class="p"><span class="passo">1</span><div><b>Você é ${esc(cfg.papeis[papel()].nome.toLowerCase())}</b><br>${esc(cfg.papeis[papel()].resumo)}</div></div>
    <div class="p"><span class="passo">2</span><div><b>${papel() === 'acs' ? 'Percorra o território' : 'Atenda a fila'}</b><br>${papel() === 'acs' ? 'Toque numa pessoa para aferir, orientar ou convidar; toque numa casa para visitar a família.' : 'Toque numa pessoa sentada na espera (⏳) para chamar. Depois escolha o atendimento e o encaminhamento.'}</div></div>
    <div class="p"><span class="passo">3</span><div><b>A equipe trabalha sozinha</b><br>Os outros profissionais agem por conta própria. Você não controla ninguém além do seu personagem.</div></div>
    <div class="p"><span class="passo">4</span><div><b>Resultados</b><br>No fim de cada mês você recebe um relatório. A aba Desempenho mostra a qualidade da unidade.</div></div>`;
