<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Simulador de saúde: cuide de uma unidade básica e das famílias do seu território.">
  <title>Saúde Sim</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Saúde Sim">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="sem-jogo">
<!--CONTEUDO-->
  <div id="app">
    <header id="topo" class="topo"></header>
    <main id="vista" class="vista" hidden></main>
    <section id="mundo" class="mundo">
      <canvas id="cv" aria-label="Mapa do bairro"></canvas>
      <div id="dica" class="dica-mundo" hidden></div>
      <div class="ferr"><button data-act="centro" aria-label="Centralizar">🎯</button><button data-act="girar-dir" aria-label="Girar a câmera">⟳</button><button data-act="girar-esq" aria-label="Girar a câmera">⟲</button><button data-act="paredes" aria-label="Paredes">🧱</button><button data-act="trocar-personagem" aria-label="Trocar de personagem">👥</button></div>
      <div id="cartao" class="cartao" hidden></div>
    </section>
    <nav id="rodape" class="rodape"></nav>
  </div>
  <div id="folha-host"></div>
  <div id="toast" role="status"></div>
<!--/CONTEUDO-->
  <script src="vendor/three.min.js"></script>
  <script type="module" src="src/main.js"></script>
  <script>
    // App instalável e offline (só em https ou localhost).
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
